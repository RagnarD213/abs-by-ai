<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Assistant Tasks</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0d0d0d;
  --surface: #141414;
  --surface2: #1c1c1c;
  --border: #2a2a2a;
  --text: #f0f0f0;
  --muted: #7a7a7a;
  --green: #22c55e;
  --red: #ef4444;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  min-height: 100vh;
  padding: max(20px, env(safe-area-inset-top)) 16px calc(28px + env(safe-area-inset-bottom));
}
.wrap { max-width: 640px; margin: 0 auto; }

.head { margin-bottom: 20px; }
.title { font-size: 26px; font-weight: 800; letter-spacing: -0.02em; }
.sub { color: var(--muted); font-size: 13px; margin-top: 4px; }

.summary {
  display: flex; align-items: center; gap: 10px;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 10px; padding: 10px 14px; margin-bottom: 16px;
  font-size: 13px; color: var(--muted);
}
.summary strong { color: var(--text); font-weight: 700; }
.bar { flex: 1; height: 6px; background: var(--surface2); border-radius: 99px; overflow: hidden; }
.bar > i { display: block; height: 100%; width: 0%; background: var(--green); transition: width .3s; }

.section-label {
  font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em;
  color: var(--muted); font-weight: 700; margin: 22px 0 8px;
}

ul { list-style: none; }
.task {
  display: flex; align-items: flex-start; gap: 12px;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 10px; padding: 14px; margin-bottom: 8px;
  cursor: pointer; transition: border-color .15s, opacity .15s;
}
.task:active { border-color: var(--muted); }
.cb {
  flex-shrink: 0; width: 22px; height: 22px; margin-top: 1px;
  border: 2px solid var(--muted); border-radius: 6px;
  display: flex; align-items: center; justify-content: center;
  font-size: 14px; font-weight: 800; color: var(--bg);
}
.task.done { opacity: 0.45; }
.task.done .cb { background: var(--green); border-color: var(--green); }
.task.done .cb::after { content: '✓'; }
.task.done .txt { text-decoration: line-through; }
.txt { font-size: 15px; line-height: 1.4; word-break: break-word; }
.why { display: block; color: var(--muted); font-size: 12.5px; margin-top: 4px; }
.mine { display: inline-block; color: var(--muted); font-size: 11px; margin-top: 5px; }
.sched { display: block; color: var(--muted); font-size: 11.5px; margin-top: 4px; }

/* Priority badge. Same words Dan sees on his dashboard, so "the high priority
   one" means the same thing to both of them. Tasks are sorted by this. */
.body { flex: 1; min-width: 0; }
.tag {
  flex-shrink: 0; margin-top: 2px;
  font-size: 10.5px; font-weight: 700; letter-spacing: 0.04em;
  text-transform: uppercase; padding: 3px 8px; border-radius: 99px;
  white-space: nowrap;
}
.tag-key  { background: rgba(34,197,94,0.15);  color: #22c55e; box-shadow: 0 0 0 1px rgba(34,197,94,0.35); }
.tag-high { background: rgba(234,179,8,0.15);  color: #eab308; }
.tag-med  { background: rgba(239,68,68,0.15);  color: #ef4444; }
.tag-low  { background: rgba(183,121,63,0.18); color: #b7793f; }
/* Below Low on purpose — it means Dan hasn't triaged it yet, NOT that he
   ranked it unimportant. Kept visually neutral for exactly that reason. */
.tag-unassigned { background: rgba(255,255,255,0.06); color: var(--muted); box-shadow: 0 0 0 1px rgba(255,255,255,0.09); }

.empty { color: var(--muted); font-size: 14px; padding: 18px 2px; }

.add {
  display: flex; gap: 8px; margin-top: 24px;
  border-top: 1px solid var(--border); padding-top: 18px;
}
.add input {
  flex: 1; min-width: 0;
  background: var(--surface2); border: 1px solid var(--border);
  color: var(--text); border-radius: 9px; padding: 12px 13px;
  font-family: inherit; font-size: 15px;
}
.add input:focus { outline: none; border-color: var(--muted); }
.add button {
  flex-shrink: 0; background: var(--text); color: var(--bg);
  border: none; border-radius: 9px; padding: 0 18px;
  font-family: inherit; font-size: 15px; font-weight: 700; cursor: pointer;
}
.add button:disabled { opacity: 0.45; cursor: default; }
.add-note { color: var(--muted); font-size: 12px; margin-top: 8px; line-height: 1.45; }

.timer-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 10px; padding: 20px; margin-bottom: 18px;
  text-align: center;
}
.timer-display {
  font-size: 42px; font-weight: 800; font-variant-numeric: tabular-nums;
  letter-spacing: 0.01em; margin-bottom: 6px; color: var(--text);
}
.timer-display.active { color: var(--green); }
.timer-status {
  display: flex; align-items: center; justify-content: center; gap: 7px;
  color: var(--muted); font-size: 12.5px; margin-bottom: 16px;
}
.timer-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex-shrink: 0; }
.timer-status.active .timer-dot { background: var(--green); animation: timer-pulse 1.5s infinite; }
@keyframes timer-pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.25; } }
.timer-btn {
  width: 100%; border: none; border-radius: 10px; padding: 15px;
  font-family: inherit; font-size: 16px; font-weight: 700; cursor: pointer;
  background: var(--green); color: #062011;
}
.timer-btn.stop { background: var(--red); color: #200606; }
.timer-btn:disabled { opacity: 0.5; cursor: default; }
.timer-today { color: var(--muted); font-size: 12px; margin-top: 14px; }

.toast {
  position: fixed; left: 50%; transform: translateX(-50%);
  bottom: calc(20px + env(safe-area-inset-bottom));
  background: var(--surface2); border: 1px solid var(--border);
  color: var(--text); padding: 11px 18px; border-radius: 9px;
  font-size: 14px; box-shadow: 0 6px 24px rgba(0,0,0,.5); z-index: 50;
}
.toast.err { border-color: var(--red); }
.offline { color: var(--red); font-size: 13px; margin-bottom: 14px; }
</style>
</head>
<body>
<div class="wrap">

  <div class="head">
    <div class="title">Assistant Tasks</div>
    <div class="sub">Tap a task to mark it done.</div>
  </div>

  <div id="offline" class="offline" style="display:none">
    Couldn't reach the server — showing the last list loaded. Changes may not save.
  </div>

  <div class="timer-card">
    <div class="timer-display" id="timer-display">00:00:00</div>
    <div class="timer-status" id="timer-status"><span class="timer-dot"></span><span id="timer-status-text">Not clocked in</span></div>
    <button class="timer-btn" id="timer-btn">▶ Start working</button>
    <div class="timer-today" id="timer-today" style="display:none"></div>
  </div>

  <div class="summary" id="summary" style="display:none">
    <span><strong id="count-done">0</strong> of <strong id="count-total">0</strong> done</span>
    <span class="bar"><i id="bar-fill"></i></span>
  </div>

  <div id="open-wrap">
    <ul id="open-list"></ul>
  </div>

  <div id="done-wrap" style="display:none">
    <div class="section-label">Completed</div>
    <ul id="done-list"></ul>
  </div>

  <div class="add">
    <input type="text" id="new-text" placeholder="Add a task…" maxlength="300" autocomplete="off">
    <button id="add-btn">Add</button>
  </div>
  <div class="add-note">Anything you add goes to the bottom of the list for Dan to review and prioritize.</div>

</div>

<script>
// ── Assistant page ────────────────────────────────────────────────────────────
// Reads/writes ONLY the `assistant` task list, through /api/assistant-tasks (which
// does a server-side merge so this page can never overwrite the other lists) and
// the shared /api/task-checks completion store. Check ids are `assistant::<text>`,
// the same scheme the main dashboard uses, so a task ticked here shows struck
// through on Dan's dashboard and vice-versa.

let tasks = [];
let checked = new Set();
let taskLog = {};
let checkedAt = {};   // id → "YYYY-MM-DD" it was checked off
let busy = false;
// Toggles the server has not confirmed yet. A write resolves BEFORE the stored
// value is readable, so a snapshot landing in that gap would revert the checkbox
// under her finger. An entry therefore survives until a server snapshot agrees
// with it, with a hard backstop so a disagreeing server can't pin it forever.
const pendingChecks = new Map(); // id → { checked, recurring, at, inFlight }
const PENDING_MAX_MS = 30000;

function today() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function checkId(text) { return `assistant::${text}`; }
function isDone(t) {
  const id = checkId(t.text);
  return t.recurring ? (taskLog[id] || []).includes(today()) : checked.has(id);
}
// ── Scheduled recurrence (day-of-week) ──
// `recurring: true` alone means every day. `days: [0,4]` (0=Sun … 6=Sat) narrows
// it to those weekdays: the task is simply not on her list the rest of the week,
// and comes back on its next scheduled morning. Absent/empty `days` = daily, so
// tasks written before this existed behave exactly as they did.
// Spelled out, not "Tue" + "days" — that produces "Tuedays".
const DAY_PLURAL = ['Sundays', 'Mondays', 'Tuesdays', 'Wednesdays', 'Thursdays', 'Fridays', 'Saturdays'];
function taskDays(t) {
  const d = Array.isArray(t?.days) ? t.days.filter(n => Number.isInteger(n) && n >= 0 && n <= 6) : [];
  return d.length === 7 ? [] : d;
}
function isScheduledToday(t) {
  if (!t?.recurring) return true;
  const d = taskDays(t);
  return !d.length || d.includes(new Date().getDay());
}
function scheduleLabel(t) {
  const d = taskDays(t);
  if (!d.length) return 'Every day';
  const names = [...new Set(d)].sort().map(n => DAY_PLURAL[n]);
  return names.length === 1 ? names[0] : names.slice(0, -1).join(', ') + ' & ' + names[names.length - 1];
}

// A finished task clears off this page at 8am the morning AFTER it was checked
// off, so the list doesn't accumulate — but a wrong tap is still undoable for the
// rest of the day it happened. Measured against HER clock, not the server's.
// Recurring tasks need no rule here: they un-check themselves at midnight and
// come back as open work on their own.
const CLEAR_HOUR = 8;
function clearsFromView(t) {
  if (t.recurring || !isDone(t)) return false;
  const on = checkedAt[checkId(t.text)];
  if (!on) return true; // checked before completion dates were recorded — it's old
  const [y, m, d] = on.split('-').map(Number);
  const cutoff = new Date(y, m - 1, d + 1, CLEAR_HOUR, 0, 0, 0);
  return Date.now() >= cutoff.getTime();
}

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function toast(msg, type) {
  const el = document.createElement('div');
  el.className = 'toast' + (type ? ' ' + type : '');
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 3200);
}

// Dan's priorities decide the order and are shown on each task; she can read a
// priority but never set one. "unassigned" sorts last — it means he hasn't
// triaged it yet, which is why it is distinct from (and below) "low".
const PRI_ORDER = { key: 0, high: 1, med: 2, low: 3, unassigned: 4 };
// Plain "Low" here. Dan's dashboard decorates that label with an emoji that is
// his own shorthand for his own tasks; on her list it would read as a dig at
// her work, so this page keeps the wording neutral.
const PRI_LABEL = { key: 'Key', high: 'High', med: 'Medium', low: 'Low', unassigned: 'Unassigned' };
const priClass = (p) => 'tag-' + (PRI_LABEL[p] ? p : 'low');
const priLabel = (p) => PRI_LABEL[p] || 'Low';

function render() {
  const sorted = tasks.slice()
    .filter(t => isScheduledToday(t) && !clearsFromView(t))
    .sort((a, b) => (PRI_ORDER[a.priority] ?? 3) - (PRI_ORDER[b.priority] ?? 3));
  const open = sorted.filter(t => !isDone(t));
  const done = sorted.filter(t => isDone(t));

  const row = (t, isDoneRow) => `
    <li class="task${isDoneRow ? ' done' : ''}" data-text="${esc(t.text)}">
      <div class="cb"></div>
      <div class="body">
        <span class="txt">${esc(t.text)}${t.recurring ? ` <span title="${esc(scheduleLabel(t))}">🔁</span>` : ''}</span>
        ${t.recurring && taskDays(t).length ? `<span class="sched">Repeats ${esc(scheduleLabel(t))}</span>` : ''}
        ${t.why ? `<span class="why">${esc(t.why)}</span>` : ''}
        ${t.addedBy === 'assistant' && t.priority === 'unassigned'
          ? '<span class="mine">Added by you — waiting on Dan to prioritize</span>' : ''}
      </div>
      <span class="tag ${priClass(t.priority)}">${priLabel(t.priority)}</span>
    </li>`;

  document.getElementById('open-list').innerHTML = open.length
    ? open.map(t => row(t, false)).join('')
    : `<li class="empty">${sorted.length ? 'All done. Nice work. 🎉' : 'No tasks right now.'}</li>`;

  document.getElementById('done-wrap').style.display = done.length ? '' : 'none';
  document.getElementById('done-list').innerHTML = done.map(t => row(t, true)).join('');

  // Counts follow what she can actually SEE — a total that included cleared-off
  // tasks would never reach 100%.
  const summary = document.getElementById('summary');
  if (sorted.length) {
    summary.style.display = '';
    document.getElementById('count-done').textContent = done.length;
    document.getElementById('count-total').textContent = sorted.length;
    document.getElementById('bar-fill').style.width = Math.round(done.length / sorted.length * 100) + '%';
  } else {
    summary.style.display = 'none';
  }
}

// Drop pending entries the server has now confirmed (or that have aged out).
function reconcilePendingChecks(serverChecked, serverLog) {
  const now = Date.now();
  pendingChecks.forEach((p, id) => {
    if (now - p.at > PENDING_MAX_MS) { pendingChecks.delete(id); return; }
    if (p.inFlight) return;
    const serverSays = p.recurring
      ? (serverLog?.[id] || []).includes(today())
      : (serverChecked || []).includes(id);
    if (serverSays === p.checked) pendingChecks.delete(id);
  });
}

function applyPendingChecks() {
  pendingChecks.forEach((p, id) => {
    if (p.recurring) {
      const days = new Set(taskLog[id] || []);
      if (p.checked) days.add(today()); else days.delete(today());
      if (days.size) taskLog[id] = [...days].sort(); else delete taskLog[id];
    } else {
      if (p.checked) checked.add(id); else checked.delete(id);
      // Keep the completion date in step with the optimistic flip, or a task she
      // just ticked would have no date and read as an old one — i.e. vanish on
      // the spot instead of staying put until tomorrow morning.
      if (p.checked) checkedAt[id] = checkedAt[id] || today();
      else delete checkedAt[id];
    }
  });
}

// Adopt a server snapshot (from a poll or from the live stream), keeping our own
// in-flight writes on top.
function applyServerState({ tasks: t, checked: c, log, checkedAt: at }) {
  reconcilePendingChecks(c, log);
  if (Array.isArray(t)) tasks = t;
  if (Array.isArray(c)) checked = new Set(c);
  if (log && typeof log === 'object') taskLog = log;
  if (at && typeof at === 'object') checkedAt = at;
  applyPendingChecks();
  cacheState();
  render();
}

function cacheState() {
  localStorage.setItem('assistantCache', JSON.stringify({
    tasks, checked: [...checked], log: taskLog, checkedAt,
  }));
}

async function load() {
  try {
    const r = await fetch('/api/assistant-tasks', { cache: 'no-store' });
    if (!r.ok) throw new Error('load failed');
    const d = await r.json();
    reconcilePendingChecks(d.checked, d.log);
    tasks = Array.isArray(d.tasks) ? d.tasks : [];
    checked = new Set(Array.isArray(d.checked) ? d.checked : []);
    taskLog = (d.log && typeof d.log === 'object') ? d.log : {};
    checkedAt = (d.checkedAt && typeof d.checkedAt === 'object') ? d.checkedAt : {};
    applyPendingChecks();
    document.getElementById('offline').style.display = 'none';
    cacheState();
  } catch (e) {
    // Fall back to the last good list so the page is still usable offline.
    document.getElementById('offline').style.display = '';
    try {
      const c = JSON.parse(localStorage.getItem('assistantCache') || 'null');
      if (c) {
        tasks = c.tasks || []; checked = new Set(c.checked || []);
        taskLog = c.log || {}; checkedAt = c.checkedAt || {};
      }
    } catch (_) { /* ignore */ }
  }
  render();
}

async function toggle(text) {
  const t = tasks.find(x => x.text === text);
  if (!t) return;
  const id = checkId(text);
  const rec = !!t.recurring;
  const nowChecked = !isDone(t);

  // Optimistic: flip locally and repaint, then persist.
  if (rec) {
    const days = new Set(taskLog[id] || []);
    if (nowChecked) days.add(today()); else days.delete(today());
    if (days.size) taskLog[id] = [...days].sort(); else delete taskLog[id];
  } else {
    if (nowChecked) checked.add(id); else checked.delete(id);
    if (nowChecked) checkedAt[id] = today(); else delete checkedAt[id];
  }
  render();

  const pending = { checked: nowChecked, recurring: rec, at: Date.now(), inFlight: true };
  pendingChecks.set(id, pending);
  try {
    const r = await fetch('/api/task-checks', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ id, checked: nowChecked, recurring: rec, date: today(), confirmUncheck: true }),
    });
    if (!r.ok) throw new Error('save failed');
    pending.inFlight = false;
    // The response body IS the post-write state, so use it as the confirming
    // snapshot. Our own write is broadcast BEFORE its response is sent, so that
    // frame arrives while this is still in flight and is skipped — without this,
    // nothing would ever clear the entry and it would keep overriding a later
    // change made on the dashboard until the 30s backstop expired.
    const d = await r.json().catch(() => null);
    if (d && Array.isArray(d.checked)) {
      applyServerState({ checked: d.checked, log: d.log, checkedAt: d.checkedAt });
    } else {
      pendingChecks.delete(id);
    }
  } catch (e) {
    pendingChecks.delete(id);
    toast("Couldn't save that — check your connection", 'err');
    load(); // resync to the truth
  }
}

// ── Time tracker ──
// The server timestamps start/stop, so the elapsed time shown here is always
// `now - startedAt` against the SERVER's clock — closing the tab, refreshing,
// or opening this page on another device never loses or resets it.
let tsActive = null;   // { startedAt: ISOString } | null
let tsEntries = [];    // [{ start, end, seconds }]
let tsTick = null;
let tsBusy = false;

function fmtHMS(sec) {
  sec = Math.max(0, Math.floor(sec));
  const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
  return [h, m, s].map(n => String(n).padStart(2, '0')).join(':');
}
function fmtHM(sec) {
  sec = Math.max(0, Math.floor(sec));
  const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60);
  return h ? `${h}h ${m}m` : `${m}m`;
}

function renderTimer() {
  const display = document.getElementById('timer-display');
  const status = document.getElementById('timer-status');
  const statusText = document.getElementById('timer-status-text');
  const btn = document.getElementById('timer-btn');
  if (tsActive) {
    const elapsed = (Date.now() - new Date(tsActive.startedAt).getTime()) / 1000;
    display.textContent = fmtHMS(elapsed);
    display.classList.add('active');
    status.classList.add('active');
    statusText.textContent = 'Clocked in';
    btn.textContent = '⏸ Stop working';
    btn.classList.add('stop');
  } else {
    display.textContent = '00:00:00';
    display.classList.remove('active');
    status.classList.remove('active');
    statusText.textContent = 'Not clocked in';
    btn.textContent = '▶ Start working';
    btn.classList.remove('stop');
  }
  renderUnpaidTotal();
}

// Unpaid time, NOT today's time. `tsEntries` is the server's unpaid list — it
// keeps accumulating across days and only empties when Dan marks it paid, so a
// day that ends without a payment carries straight into the next one.
function renderUnpaidTotal() {
  const el = document.getElementById('timer-today');
  const sessionCount = tsEntries.length + (tsActive ? 1 : 0);
  if (!sessionCount) { el.style.display = 'none'; return; }
  let totalSec = tsEntries.reduce((sum, e) => sum + (e.seconds || 0), 0);
  if (tsActive) totalSec += (Date.now() - new Date(tsActive.startedAt).getTime()) / 1000;
  const since = tsEntries.length ? (tsEntries[0].start || '') : (tsActive?.startedAt || '');
  const sinceLabel = since ? ` since ${new Date(since).toLocaleDateString(undefined, { month: 'short', day: 'numeric' })}` : '';
  el.style.display = '';
  el.textContent = `Unpaid: ${fmtHM(totalSec)} across ${sessionCount} session${sessionCount === 1 ? '' : 's'}${sinceLabel}`;
}

function startTick() { stopTick(); tsTick = setInterval(renderTimer, 1000); }
function stopTick() { if (tsTick) { clearInterval(tsTick); tsTick = null; } }

// Applied from the initial load, the live stream, and the 60s poll fallback.
// `active` may arrive alone (from the stream); `entries` only on a full load.
function applyTimesheetState(ts) {
  if (!ts) return;
  if ('active' in ts) tsActive = ts.active || null;
  if (Array.isArray(ts.entries)) tsEntries = ts.entries;
  if (tsActive) startTick(); else stopTick();
  renderTimer();
}

async function loadTimesheet() {
  try {
    const r = await fetch('/api/timesheet', { cache: 'no-store' });
    if (!r.ok) throw new Error('load failed');
    applyTimesheetState(await r.json());
  } catch (e) { /* keep whatever state we already have */ }
}

async function toggleTimer() {
  if (tsBusy) return;
  tsBusy = true;
  const btn = document.getElementById('timer-btn');
  btn.disabled = true;
  try {
    if (tsActive) {
      const r = await fetch('/api/timesheet/stop', { method: 'POST' });
      const d = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(d.error || 'stop failed');
      tsActive = null;
      if (Array.isArray(d.entries)) tsEntries = d.entries;
      stopTick();
      renderTimer();
      if (d.entry) toast(`Logged ${fmtHM(d.entry.seconds)}`);
    } else {
      const r = await fetch('/api/timesheet/start', { method: 'POST' });
      const d = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(d.error || 'start failed');
      tsActive = d.active;
      startTick();
      renderTimer();
      if (!d.alreadyActive) toast('Clocked in');
    }
  } catch (e) {
    toast(e.message || "Couldn't reach the server", 'err');
  } finally {
    tsBusy = false;
    btn.disabled = false;
  }
}

document.getElementById('timer-btn').addEventListener('click', toggleTimer);
loadTimesheet();

async function addTask() {
  const input = document.getElementById('new-text');
  const btn = document.getElementById('add-btn');
  const text = input.value.trim();
  if (!text || busy) return;
  busy = true; btn.disabled = true;
  try {
    const r = await fetch('/api/assistant-tasks', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text }),
    });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(d.error || 'add failed');
    tasks = Array.isArray(d.tasks) ? d.tasks : tasks;
    input.value = '';
    render();
    toast('Added — Dan will review it');
  } catch (e) {
    toast(e.message || "Couldn't add that task", 'err');
  } finally {
    busy = false; btn.disabled = false;
    input.focus();
  }
}

document.getElementById('open-list').addEventListener('click', (e) => {
  const li = e.target.closest('.task');
  if (li) toggle(li.dataset.text);
});
document.getElementById('done-list').addEventListener('click', (e) => {
  const li = e.target.closest('.task');
  if (li) toggle(li.dataset.text);
});
document.getElementById('add-btn').addEventListener('click', addTask);
document.getElementById('new-text').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') addTask();
});

load();

// ── LIVE PUSH ──
// One unified status across both surfaces: this stream delivers a change the
// moment it is made on Dan's dashboard (or another device), including while
// this tab is in the background. The poll below is only a fallback for when the
// stream can't be held open; EventSource handles its own reconnection.
function openTaskStream() {
  if (!('EventSource' in window)) return;
  let es;
  try { es = new EventSource('/api/tasks-events'); } catch (e) { return; }
  es.addEventListener('tasks', (e) => {
    try {
      const d = JSON.parse(e.data);
      applyServerState({
        tasks: d.todos ? (d.todos.assistant || []) : undefined,
        checked: d.task_checks?.checked,
        log: d.task_checks?.log,
        checkedAt: d.task_checks?.checkedAt,
      });
      if (d.timesheet) applyTimesheetState(d.timesheet);
      document.getElementById('offline').style.display = 'none';
    } catch (err) { console.warn('bad task stream frame:', err); }
  });
  es.onerror = () => { /* transient; EventSource will retry */ };
}
openTaskStream();

setInterval(() => { if (!busy && !document.hidden) { load(); loadTimesheet(); } }, 60000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) { load(); loadTimesheet(); } });
</script>
</body>
