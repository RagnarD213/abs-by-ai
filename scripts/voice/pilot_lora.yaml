# Phase C pilot LoRA (Dan Voice P2C, 2026-10-16). Run:
#   ~/.venvs/voice-pilot/bin/python -m mlx_lm lora -c scripts/voice/pilot_lora.yaml
# Data from scripts/voice/pilot_data.py; model and adapters on the Expansion drive.
model: /Users/danielrose/.cache/voice-pilot/llama31-8b-4bit   # internal disk; from the external drive it trained at 35 tok/s
train: true
data: voice-corpus/pilot/data
fine_tune_type: lora
mask_prompt: true          # learn his text only, not the brief
num_layers: 16             # the top half of the layers (standard LoRA)
batch_size: 1
grad_accumulation_steps: 4
iters: 700                 # about 1.2 epochs of 589 examples
learning_rate: 3.0e-5        # 1e-4 diverged on 2026-10-16 (val loss 1.56 to 2.70 by step 100)
lora_parameters:
  rank: 16
  scale: 20.0
  dropout: 0.05
max_seq_length: 2048
grad_checkpoint: true
steps_per_report: 25
steps_per_eval: 100
val_batches: 36
save_every: 100
adapter_path: /Volumes/Expansion/voice-pilot/adapters/r1
seed: 20261016
