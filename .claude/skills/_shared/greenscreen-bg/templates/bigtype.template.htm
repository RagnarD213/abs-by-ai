<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=__W__, height=__H__" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      /* Green-screen background type 7, BIG TYPE (Dan, 2026-10-24: "when we mention the numbers"): the number and the
         drug, huge and faint, on the moving Soft Blue field, left of Dan. Opaque: the whole background behind the keyed
         presenter. Drawn on a canvas because it is a background texture, deliberately low contrast (text checks are for
         readable copy). Lines slide in (a whole leading number counts up), drift apart slowly, a soft light crosses them. */
      @font-face { font-family: "Poppins"; src: url("assets/Poppins-Bold.ttf") format("truetype"); font-weight: 700; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: __W__px; height: __H__px; overflow: hidden; background: rgb(5, 13, 28); }
      #root { position: relative; width: 100%; height: 100%; font-family: "Poppins", sans-serif; font-weight: 700; background: rgb(5, 13, 28); }
      #field, #type { position: absolute; left: 0; top: 0; width: __W__px; height: __H__px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="__ID__" data-start="0" data-duration="__DUR__" data-width="__W__" data-height="__H__">
      <canvas id="field" width="__W__" height="__H__"></canvas>
      <canvas id="type" width="__W__" height="__H__"></canvas>
    </div>
    <script>
      const CFG = __CFG__;
      const D = CFG.dur;
      const $ = id => document.getElementById(id);
      // ---------- the moving Soft Blue field (softblue.field, same formula) ----------
      const CW = __W__, CH = __H__, GW = Math.round(CW / 4), GH = Math.round(CH / 4), cv = $("field"), ctx = cv.getContext("2d");
      const off = document.createElement("canvas"); off.width = GW; off.height = GH;
      const octx = off.getContext("2d"), img = octx.createImageData(GW, GH);
      let seed = 8; const rnd = () => { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; };
      const noise = new Float32Array(GW * GH);
      for (let i = 0; i < noise.length; i++) { const u = Math.max(1e-9, rnd()), v = rnd(); noise[i] = 0.42 * Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); }
      const FS = Math.min(CW, CH) / 1080, SX = CW / (1920 * FS), SY = CH / (1080 * FS);
      function drawField(t) {
        t += CFG.t_field || 0;
        const gx = .14 + .13 * Math.sin(t * .65), gy = .2 + .13 * Math.cos(t * .4), hx = .83 + .12 * Math.cos(t * .6), hy = .88;
        const d = img.data;
        for (let y = 0; y < GH; y++) {
          const yy = y / GH, gyv = (yy - gy) * SY * (yy - gy) * SY / .35, kyv = (yy - hy) * SY * (yy - hy) * SY / .18;
          for (let x = 0; x < GW; x++) {
            const xx = x / GW, i = y * GW + x;
            const g = Math.exp(-((xx - gx) * SX * (xx - gx) * SX / .18 + gyv)), k = Math.exp(-((xx - hx) * SX * (xx - hx) * SX / .12 + kyv));
            const n = noise[i], o = i * 4;
            d[o] = Math.min(255, Math.max(0, 5 + g * 5 + k * 3 + n)) | 0;
            d[o + 1] = Math.min(255, Math.max(0, 13 + g * 53 + k * 26 + n)) | 0;
            d[o + 2] = Math.min(255, Math.max(0, 28 + g * 94 + k * 62 + n)) | 0;
            d[o + 3] = 255;
          }
        }
        octx.putImageData(img, 0, 0);
        ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = "low";
        ctx.drawImage(off, 0, 0, CW, CH);
      }
      // ---------- the type, a pure function of the scene time ----------
      const tc = $("type"), tx = tc.getContext("2d");
      const inE = gsap.parseEase("power3.out"), cntE = gsap.parseEase("power2.out"), drE = gsap.parseEase("sine.inOut"), shE = gsap.parseEase("sine.inOut");
      const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
      function drawType(t) {
        tx.clearRect(0, 0, CW, CH);
        CFG.lines.forEach((L, n) => {
          const p = clamp((t - L.t) / 0.6, 0, 1), e = inE(p);
          if (p <= 0) return;
          let s = L.s;
          if (L.count) s = L.count.pre + String(Math.round(L.count.value * cntE(clamp((t - L.t) / 0.7, 0, 1)))) + L.count.post;
          const dr = drE(clamp(t / D, 0, 1)), sc = 1 + 0.025 * dr;
          const x = L.x - 70 * (1 - e), y = L.y + L.dy * dr;
          tx.save();
          tx.translate(x, y); tx.scale(sc, sc);
          tx.font = `700 ${L.px}px Poppins`; tx.textBaseline = "top";
          tx.globalAlpha = e * CFG.opacity;
          tx.fillStyle = `rgb(${CFG.color.join(",")})`;
          tx.fillText(s, 0, 0);
          // a soft light crosses the letters every few seconds
          const k = Math.floor((t - 0.8 - n * 0.3) / 3.4), ph = (t - 0.8 - n * 0.3) - k * 3.4;
          if (k >= 0 && ph < 1.6) {
            const w = tx.measureText(s).width, cx = -0.3 * w + 1.6 * w * shE(ph / 1.6);
            const gr = tx.createLinearGradient(cx - 0.12 * w, 0, cx + 0.12 * w, 0);
            gr.addColorStop(0, "rgba(150,210,255,0)"); gr.addColorStop(0.5, "rgba(150,210,255,0.45)"); gr.addColorStop(1, "rgba(150,210,255,0)");
            tx.globalAlpha = e; tx.globalCompositeOperation = "source-atop"; tx.fillStyle = gr;
            tx.fillRect(cx - 0.12 * w, -L.px * 0.1, 0.24 * w, L.px * 1.3);
          }
          tx.restore();
        });
      }
      const tl = gsap.timeline({ paused: true });
      const clock = { t: 0 };
      drawField(0); drawType(0);
      document.fonts.load(`700 200px Poppins`).then(() => drawType(clock.t));
      tl.fromTo(clock, { t: 0 }, { t: D, duration: D, ease: "none", onUpdate: () => { drawField(clock.t); drawType(clock.t); } }, 0);
      window.__timelines["__ID__"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
