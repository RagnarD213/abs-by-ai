<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=__W__, height=__H__" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      /* Green-screen background type 4, the SIDE PANEL (Dan, 2026-10-24): the person's before / after pair in the
         approved photo frame (before-card), their name and their weight lost + medication, on the moving Soft Blue
         field, left of Dan. Opaque: this is the whole background behind the keyed presenter. Geometry from hfbg.py. */
      @font-face { font-family: "Poppins"; src: url("assets/Poppins-Bold.ttf") format("truetype"); font-weight: 700; }
      @font-face { font-family: "Poppins"; src: url("assets/Poppins-Regular.ttf") format("truetype"); font-weight: 400; }
      :root { --cyan: rgb(104, 197, 255); --white: rgb(244, 250, 255); --cite: rgb(150, 182, 210); --spec: rgb(135, 210, 248); }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: __W__px; height: __H__px; overflow: hidden; background: rgb(5, 13, 28); }
      #root { position: relative; width: 100%; height: 100%; font-family: "Poppins", sans-serif; font-weight: 700; background: rgb(5, 13, 28); }
      #field { position: absolute; left: 0; top: 0; width: __W__px; height: __H__px; }
      #panel { position: absolute; left: 0; top: 0; width: __W__px; height: __H__px; }
      .pg { position: absolute; left: 0; top: 0; width: __W__px; height: __H__px; }
      .shadow { position: absolute; border-radius: 36px; background: rgba(0, 2, 12, 0.43); filter: blur(10px); }
      .frame { position: absolute; border-radius: 26px; background: rgb(42, 80, 113); border: 2px solid rgba(118, 183, 222, 0.59); overflow: hidden; }
      .clip { position: absolute; overflow: hidden; border-radius: 16px; }
      .clip img { display: block; width: 100%; height: 100%; object-fit: cover; }
      .year { position: absolute; background: rgba(6, 17, 30, 0.88); white-space: nowrap; line-height: 1.4; color: var(--cyan); font-weight: 700; }
      .sweep { position: absolute; top: -30%; width: 160px; height: 160%; transform: rotate(16deg);
        background: linear-gradient(90deg, rgba(170, 225, 255, 0), rgba(170, 225, 255, 0.13) 50%, rgba(170, 225, 255, 0)); }
      .t { position: absolute; white-space: nowrap; line-height: 1.4; }
      .t span { display: inline-block; white-space: pre; }
      #name { color: var(--white); }
      #stat { color: var(--cyan); }
      #cite { color: var(--cite); font-weight: 400; }
      #acc { position: absolute; height: 4px; border-radius: 2px; background: var(--spec); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="__ID__" data-start="0" data-duration="__DUR__" data-width="__W__" data-height="__H__">
      <canvas id="field" width="__W__" height="__H__"></canvas>
      <div id="panel"></div>
    </div>
    <script>
      const CFG = __CFG__;
      const D = CFG.dur;
      const px = v => v + "px";
      const place = (e, x, y, w, h) => Object.assign(e.style, { left: px(x), top: px(y), width: w == null ? "" : px(w), height: h == null ? "" : px(h) });
      const $ = id => document.getElementById(id);
      const mk = (cls, parent, tag) => { const e = document.createElement(tag || "div"); if (cls) e.className = cls; parent.appendChild(e); return e; };
      // ---------- the moving Soft Blue field (softblue.field, same formula) ----------
      const CW = __W__, CH = __H__, GW = Math.round(CW / 4), GH = Math.round(CH / 4), cv = $("field"), ctx = cv.getContext("2d");
      const off = document.createElement("canvas"); off.width = GW; off.height = GH;
      const octx = off.getContext("2d"), img = octx.createImageData(GW, GH);
      let seed = 8; const rnd = () => { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; };
      const noise = new Float32Array(GW * GH);
      for (let i = 0; i < noise.length; i++) { const u = Math.max(1e-9, rnd()), v = rnd(); noise[i] = 0.42 * Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); }
      const FS = Math.min(CW, CH) / 1080, SX = CW / (1920 * FS), SY = CH / (1080 * FS);
      function drawField(t) {
        t += CFG.t_field || 0;
        const gx = .14 + .13 * Math.sin(t * .65), gy = .2 + .13 * Math.cos(t * .4), hx = .83 + .12 * Math.cos(t * .6), hy = .88;
        const d = img.data;
        for (let y = 0; y < GH; y++) {
          const yy = y / GH, gyv = (yy - gy) * SY * (yy - gy) * SY / .35, kyv = (yy - hy) * SY * (yy - hy) * SY / .18;
          for (let x = 0; x < GW; x++) {
            const xx = x / GW, i = y * GW + x;
            const g = Math.exp(-((xx - gx) * SX * (xx - gx) * SX / .18 + gyv)), k = Math.exp(-((xx - hx) * SX * (xx - hx) * SX / .12 + kyv));
            const n = noise[i], o = i * 4;
            d[o] = Math.min(255, Math.max(0, 5 + g * 5 + k * 3 + n)) | 0;
            d[o + 1] = Math.min(255, Math.max(0, 13 + g * 53 + k * 26 + n)) | 0;
            d[o + 2] = Math.min(255, Math.max(0, 28 + g * 94 + k * 62 + n)) | 0;
            d[o + 3] = 255;
          }
        }
        octx.putImageData(img, 0, 0);
        ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = "low";
        ctx.drawImage(off, 0, 0, CW, CH);
      }
      const tl = gsap.timeline({ paused: true });
      const clock = { t: 0 };
      drawField(0);
      tl.fromTo(clock, { t: 0 }, { t: D, duration: D, ease: "none", onUpdate: () => drawField(clock.t) }, 0);
      tl.fromTo("#panel", { y: 0 }, { y: CFG.drift, duration: D, ease: "sine.inOut" }, 0);

      // ---------- the pair: each photo rises in, then a slow push for the whole time on screen ----------
      const P = $("panel");
      CFG.photos.forEach((Q, n) => {
        const g = mk("pg", P);
        const sh = mk("shadow", g); place(sh, Q.x - 4, Q.y + 2, Q.w + 24, Q.h + 24);
        const fr = mk("frame", g); place(fr, Q.x - 10, Q.y - 10, Q.w + 20, Q.h + 20);
        const cl = mk("clip", g); place(cl, Q.x, Q.y, Q.w, Q.h);
        const im = mk(null, cl, "img"); im.src = Q.src; im.alt = ""; im.style.transformOrigin = Q.origin;
        const sw = mk("sweep", cl);
        if (Q.year) {
          const y = mk("year", g); place(y, Q.year.x, Q.year.y, Q.year.w, Q.year.h); y.style.borderRadius = px(Q.year.r);
          y.style.fontSize = px(Q.year.px); y.style.paddingLeft = px(Q.year.pad); y.style.paddingTop = px(Q.year.pt); y.textContent = Q.year.s;
        }
        const t0 = 0.05 + n * 0.14;
        tl.fromTo(g, { opacity: 0, y: 36 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, t0);
        tl.fromTo(im, { scale: 1 }, { scale: CFG.push, duration: D, ease: "power1.inOut" }, 0);
        // one light sweep across each photo's glass, then one more late in the shot
        tl.fromTo(sw, { x: -260 }, { x: Q.w + 120, duration: 1.0, ease: "power1.inOut" }, Math.min(D - 1.1, 0.9 + n * 0.25));
        if (D > 7) tl.fromTo(sw, { x: -260 }, { x: Q.w + 120, duration: 1.0, ease: "power1.inOut", immediateRender: false }, D - 3.2 + n * 0.25);
      });
      // ---------- name, weight + medication, credit ----------
      const words = (e, s) => s.split(" ").map((w, i, a) => { const sp = document.createElement("span"); sp.textContent = w + (i < a.length - 1 ? " " : ""); e.appendChild(sp); return sp; });
      const nm = mk("t", P); nm.id = "name"; place(nm, CFG.name.x, CFG.name.y); nm.style.fontSize = px(CFG.name.px);
      const st = mk("t", P); st.id = "stat"; place(st, CFG.stat.x, CFG.stat.y); st.style.fontSize = px(CFG.stat.px);
      const ac = mk(null, P); ac.id = "acc"; place(ac, CFG.acc.x, CFG.acc.y, CFG.acc.w, 4);
      const nmW = words(nm, CFG.name.s), stW = words(st, CFG.stat.s);
      tl.fromTo(nmW, { opacity: 0, y: 22 }, { opacity: 1, y: 0, duration: 0.42, ease: "expo.out", stagger: 0.08 }, 0.35);
      tl.fromTo(ac, { scaleX: 0, transformOrigin: "0% 50%" }, { scaleX: 1, duration: 0.45, ease: "power2.out" }, 0.5);
      tl.fromTo(stW, { opacity: 0, y: 22 }, { opacity: 1, y: 0, duration: 0.42, ease: "expo.out", stagger: 0.08 }, 0.62);
      // the accent keeps breathing while the panel is up
      const breaths = Math.max(1, Math.floor((D - 1.2) / 2.6));
      tl.fromTo(ac, { opacity: 1 }, { opacity: 0.45, duration: 1.3, ease: "sine.inOut", yoyo: true, repeat: breaths * 2 - 1, immediateRender: false }, 1.2);
      if (CFG.cite) {
        const ci = mk("t", P); ci.id = "cite"; place(ci, CFG.cite.x, CFG.cite.y); ci.style.fontSize = px(CFG.cite.px); ci.textContent = CFG.cite.s;
        tl.fromTo(ci, { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power1.out" }, 0.8);
      }
      window.__timelines["__ID__"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
