<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=1920,height=1080">
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script><style>
@font-face{font-family:Poppins;src:url('assets/Poppins-Bold.ttf');font-weight:700}
@font-face{font-family:Poppins;src:url('assets/Poppins-Regular.ttf');font-weight:400}
*{box-sizing:border-box;margin:0}html,body{width:1920px;height:1080px;overflow:hidden;background:transparent}
#root{position:relative;width:1920px;height:1080px;color:#f4faff;font-family:Poppins;font-weight:700}
#field{position:absolute;inset:0}#title{position:absolute;left:66px;top:38px;font-size:64px;line-height:1.4}
#accent{position:absolute;left:68px;top:137px;height:3px;width:1784px;background:#6ac8ff;transform-origin:left}
.tier{position:absolute;left:58px;width:1802px;border-radius:22px;background:#0a2648;border:2px solid #35658c;overflow:hidden}
.label{position:absolute;left:24px;top:34px;font-size:42px;line-height:1.4;color:#8dd7ff}
.item{position:absolute;border-radius:13px;background:#071b33;border:1px solid #335976;overflow:hidden}
.name{position:absolute;line-height:1.35;display:flex;align-items:center;min-height:72px}
.sweep{position:absolute;top:0;width:180px;height:3px;background:linear-gradient(90deg,transparent,#b3e8ff,transparent)}
.corner #field,.corner #accent{display:none}.corner #title{font-size:46px;left:78px;top:212px;z-index:2}
.corner .tier{left:55px;width:730px}.corner .label{top:44px;font-size:32px;opacity:0}
.note{position:absolute;left:68px;bottom:12px;font-size:18px;font-weight:400;color:#acccdf}
</style></head><body><div id="root" data-composition-id="__ID__" data-start="0" data-duration="__DUR__" data-width="1920" data-height="1080"><canvas id="field" width="1920" height="1080"></canvas><div id="title"></div><div id="accent"></div><div id="tiers"></div><div class="note"></div></div>
<script>
const C=__CFG__,D=C.dur,root=document.getElementById('root');if(C.mode==='corner')root.classList.add('corner');
document.getElementById('title').textContent=C.title||'Ab Exercises: Worst To Best';
if(C.mode==='images')document.querySelector('.note').textContent='Real Photos Of Me, Not AI-Generated';
const ctx=document.getElementById('field').getContext('2d');
function field(t){ctx.fillStyle='#050d1c';ctx.fillRect(0,0,1920,1080);const x=800+360*Math.sin(t*.18),y=650+170*Math.cos(t*.23);const g=ctx.createRadialGradient(x,y,0,x,y,1100);g.addColorStop(0,'#214f80');g.addColorStop(1,'#050d1c');ctx.fillStyle=g;ctx.fillRect(0,0,1920,1080);const h=ctx.createRadialGradient(1700-160*Math.sin(t*.31),100,0,1700,100,820);h.addColorStop(0,'rgba(56,125,180,.22)');h.addColorStop(1,'rgba(5,13,28,0)');ctx.fillStyle=h;ctx.fillRect(0,0,1920,1080)}
const tl=gsap.timeline({paused:true});window.__timelines=window.__timelines||{};window.__timelines['__ID__']=tl;
const clock={t:0};tl.fromTo(clock,{t:0},{t:D,duration:D,ease:'none',onUpdate:()=>field(clock.t)},0);
tl.fromTo('#title',{opacity:0,y:12},{opacity:1,y:0,duration:.3,ease:'power2.out'},0);
tl.fromTo('#accent',{scaleX:.1},{scaleX:1,duration:.5,ease:'power2.out'},0);
C.rows.forEach((r,i)=>{const e=document.createElement('div');e.className='tier';e.style.top=r.y+'px';e.style.height=r.h+'px';const lab=document.createElement('div');lab.className='label';lab.textContent=r.label;e.append(lab);const sp=document.createElement('div');sp.className='sweep';e.append(sp);document.getElementById('tiers').append(e);tl.fromTo(e,{opacity:0,y:12},{opacity:1,y:0,duration:.32,ease:'power2.out'},i*.05);tl.fromTo(sp,{x:-200},{x:1900,duration:D,ease:'none'},0);
r.items.forEach(item=>{const box=document.createElement('div');box.className='item';Object.assign(box.style,{left:(item.x-58)+'px',top:(item.y-r.y)+'px',width:item.w+'px',height:item.h+'px'});const name=document.createElement('div');name.className='name';name.textContent=item.name;Object.assign(name.style,{left:(item.tx-item.x)+'px',top:(item.ty-item.y)+'px',width:item.tw+'px',fontSize:item.px+'px'});box.append(name);e.append(box)});
});field(0);
</script></body></html>
