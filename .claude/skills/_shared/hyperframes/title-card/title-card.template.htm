<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=__W__, height=__H__" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      /* Soft Blue Light TITLE / STATEMENT / RECAP card: full screen on the moving field. Geometry comes from build.py. */
      @font-face { font-family: "Poppins"; src: url("assets/Poppins-Bold.ttf") format("truetype"); font-weight: 700; }
      @font-face { font-family: "Poppins"; src: url("assets/Poppins-Regular.ttf") format("truetype"); font-weight: 400; }
      :root {
        --tint: rgba(22, 51, 81, 0.498);       /* glass over the field: 0.92 x the 0.54 tint blend */
        --glass: rgba(22, 51, 81, 0.54);       /* GLASS_TINT over footage (the blur comes from the _mask pass) */
        --line: rgb(64, 112, 153);             /* GLASS_LINE */
        --cyan: rgb(104, 197, 255);            /* CYAN */
        --white: rgb(244, 250, 255);           /* WHITE */
        --spec: rgb(135, 210, 248);            /* SPECULAR */
        --chip: rgb(6, 17, 30);                /* disclosure chip */
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: __W__px; height: __H__px; overflow: hidden; background: rgb(5, 13, 28); }
      #root { position: relative; width: 100%; height: 100%; font-family: "Poppins", sans-serif; font-weight: 700; }
      #field { position: absolute; left: 0; top: 0; width: __W__px; height: __H__px; }
      .t { position: absolute; white-space: nowrap; line-height: 1.4; }
      .t span { display: inline-block; white-space: pre; }
      #accent { position: absolute; height: 8px; border-radius: 3px; background: var(--cyan); transform-origin: 0% 50%; }
      #eyebrow { color: var(--cyan); }
      .line { color: var(--white); }
      .row { position: absolute; border-radius: 36px; background: var(--tint); border: 1px solid var(--line); }
      .row .n { position: absolute; color: var(--cyan); line-height: 1.4; white-space: nowrap; }
      .row .s { position: absolute; color: var(--white); line-height: 1.4; white-space: nowrap; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="__ID__" data-start="0" data-duration="__DUR__" data-width="__W__" data-height="__H__">
      <canvas id="field" width="__W__" height="__H__"></canvas>
      <div id="group">
        <div id="accent"></div>
        <div id="eyebrow" class="t"></div>
        <div id="lines"></div>
        <div id="rows"></div>
      </div>
    </div>
    <script>
      const CFG = __CFG__;
      const D = CFG.dur;
      const px = v => v + "px";
      const place = (e, x, y, w, h) => Object.assign(e.style, { left: px(x), top: px(y), width: w == null ? "" : px(w), height: h == null ? "" : px(h) });
      const $ = id => document.getElementById(id);
      const words = (e, s) => s.split(" ").map((w, i, a) => { const sp = document.createElement("span"); sp.textContent = w + (i < a.length - 1 ? " " : ""); e.appendChild(sp); return sp; });
      // ---------- the moving Soft Blue field (softblue.field, same formula; blob size constant against the short side) ----------
      const CW = __W__, CH = __H__, GW = Math.round(CW / 4), GH = Math.round(CH / 4), cv = $("field"), ctx = cv.getContext("2d");
      const off = document.createElement("canvas"); off.width = GW; off.height = GH;
      const octx = off.getContext("2d"), img = octx.createImageData(GW, GH);
      let seed = 8; const rnd = () => { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; };
      const noise = new Float32Array(GW * GH);
      for (let i = 0; i < noise.length; i++) { const u = Math.max(1e-9, rnd()), v = rnd(); noise[i] = 0.42 * Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); }
      const FS = Math.min(CW, CH) / 1080, SX = CW / (1920 * FS), SY = CH / (1080 * FS);
      function drawField(t) {
        const gx = .14 + .13 * Math.sin(t * .65), gy = .2 + .13 * Math.cos(t * .4), hx = .83 + .12 * Math.cos(t * .6), hy = .88;
        const d = img.data;
        for (let y = 0; y < GH; y++) {
          const yy = y / GH, gyv = (yy - gy) * SY * (yy - gy) * SY / .35, kyv = (yy - hy) * SY * (yy - hy) * SY / .18;
          for (let x = 0; x < GW; x++) {
            const xx = x / GW, i = y * GW + x;
            const g = Math.exp(-((xx - gx) * SX * (xx - gx) * SX / .18 + gyv)), k = Math.exp(-((xx - hx) * SX * (xx - hx) * SX / .12 + kyv));
            const n = noise[i], o = i * 4;
            d[o] = Math.min(255, Math.max(0, 5 + g * 5 + k * 3 + n)) | 0;
            d[o + 1] = Math.min(255, Math.max(0, 13 + g * 53 + k * 26 + n)) | 0;
            d[o + 2] = Math.min(255, Math.max(0, 28 + g * 94 + k * 62 + n)) | 0;
            d[o + 3] = 255;
          }
        }
        octx.putImageData(img, 0, 0);
        ctx.globalCompositeOperation = "source-over";
        ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = "low";
        ctx.drawImage(off, 0, 0, CW, CH);
        if (typeof afterField === "function") afterField(ctx);
      }

      const tl = gsap.timeline({ paused: true });
      const clock = { t: 0 };
      drawField(0);
      tl.fromTo(clock, { t: 0 }, { t: D, duration: D, ease: "none", onUpdate: () => drawField(clock.t) }, 0);
      const g = $("group"); Object.assign(g.style, { position: "absolute", left: "0px", top: "0px", width: px(CW), height: px(CH) });
      const acc = $("accent");
      if (CFG.eyebrow) {
        place(acc, CFG.accent[0], CFG.accent[1], CFG.accent[2]);
        const eb = $("eyebrow"); place(eb, CFG.eyebrow.x, CFG.eyebrow.y); eb.style.fontSize = px(CFG.eyebrow.px); eb.textContent = CFG.eyebrow.s;
        tl.fromTo(acc, { scaleX: 0 }, { scaleX: 1, duration: 0.45, ease: "power2.out" }, 0.05);
        tl.fromTo(eb, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.42, ease: "expo.out" }, 0.08);
      } else acc.style.display = "none";
      // headline lines rise in turn (0.22 s apart), then the block drifts a few px for as long as it is up
      CFG.lines.forEach((ln, i) => {
        const e = document.createElement("div"); e.className = "t line"; place(e, ln.x, ln.y); e.style.fontSize = px(CFG.line_px);
        const w = words(e, ln.s); $("lines").appendChild(e);
        tl.fromTo(w, { opacity: 0, y: 26 }, { opacity: 1, y: 0, duration: 0.5, ease: "expo.out", stagger: 0.05 }, 0.18 + i * 0.22);
      });
      // recap rows: glass rows land one after another (0.16 s apart, or on their words when times are given)
      (CFG.rows || []).forEach((r, i) => {
        const e = document.createElement("div"); e.className = "row"; place(e, r.x, r.y, r.w, r.h);
        const n = document.createElement("div"); n.className = "n"; n.textContent = String(i + 1); n.style.fontSize = px(CFG.row_px + 6); n.style.left = px(34); n.style.top = px(CFG.row_ty - 4);
        const s = document.createElement("div"); s.className = "s"; s.textContent = r.s; s.style.fontSize = px(CFG.row_px); s.style.left = px(100); s.style.top = px(CFG.row_ty);
        e.appendChild(n); e.appendChild(s); $("rows").appendChild(e);
        tl.fromTo(e, { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.42, ease: "power2.out" }, r.t);
      });
      tl.fromTo(g, { y: 0 }, { y: CFG.drift, duration: D, ease: "sine.inOut" }, 0);

      window.__timelines["__ID__"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
