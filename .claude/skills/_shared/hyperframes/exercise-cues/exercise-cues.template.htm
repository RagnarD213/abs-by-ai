<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=1920,height=1080"><script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script><style>
@font-face{font-family:Poppins;src:url('assets/Poppins-Bold.ttf');font-weight:700}*{box-sizing:border-box;margin:0}html,body{width:1920px;height:1080px;background:transparent;overflow:hidden}#root{position:relative;width:1920px;height:1080px;font-family:Poppins;font-weight:700;color:#f4faff}#label{position:absolute;left:70px;top:66px;padding:17px 30px 22px;border-radius:19px;background:rgba(10,38,72,.95);border:2px solid #67b8e9;font-size:48px;line-height:1.35;overflow:hidden}#sweep{position:absolute;top:0;width:120px;height:3px;background:linear-gradient(90deg,transparent,#ace5ff,transparent)}svg{position:absolute;inset:0;width:1920px;height:1080px}#clock{position:absolute;right:100px;top:110px;width:300px;height:300px;border-radius:50%;background:rgba(10,38,72,.96);border:4px solid #92d8ff}#clock svg{width:300px;height:300px}#speed{position:absolute;right:84px;top:430px;width:340px;text-align:center;font-size:44px;line-height:1.4;color:#f4faff;background:rgba(10,38,72,.96);border-radius:15px;padding:10px}#second{transform-origin:150px 150px}
</style></head><body><div id="root" data-composition-id="__ID__" data-start="0" data-duration="__DUR__" data-width="1920" data-height="1080"><div id="label"><span id="text"></span><div id="sweep"></div></div><svg><g id="cross" stroke="#f34650" stroke-width="23" stroke-linecap="round"><path d="M760 380L1110 730M1110 380L760 730"/></g><g id="arrow" stroke="#f34650" fill="#f34650" stroke-linecap="round"><path id="shaft" stroke-width="13"/><path id="tip" stroke-width="2"/></g></svg><div id="clock"><svg viewBox="0 0 300 300"><g id="ticks"></g><path d="M150 150L110 98" stroke="#8ed6ff" stroke-width="11" stroke-linecap="round"/><path d="M150 150L195 88" stroke="#f4faff" stroke-width="8" stroke-linecap="round"/><path id="second" d="M150 178L150 34" stroke="#f34650" stroke-width="5" stroke-linecap="round"/><circle cx="150" cy="150" r="9" fill="#f4faff"/></svg></div><div id="speed"></div></div><script>
const C=__CFG__,D=C.dur,tl=gsap.timeline({paused:true});window.__timelines=window.__timelines||{};window.__timelines['__ID__']=tl;
document.getElementById('text').textContent=C.type==='clock'?'Hundreds Of Crunches':'Not Recommended';
for(const id of ['cross','arrow','clock','speed'])document.getElementById(id).style.display=(C.type==='clock'&&['clock','speed'].includes(id))||(C.type==='x'&&id==='cross')||(C.type==='arrow'&&id==='arrow')?'block':'none';
const a=C.at||0;tl.fromTo('#label',{opacity:0,y:12},{opacity:1,y:0,duration:.2,ease:'power2.out'},a);tl.fromTo('#sweep',{x:-150},{x:700,duration:Math.max(.1,D-a),ease:'none'},a);
if(C.type==='x')tl.fromTo('#cross',{opacity:0,scale:.9,transformOrigin:'935px 555px'},{opacity:.88,scale:1,duration:.22,ease:'power2.out'},a);
if(C.type==='clock'){document.getElementById('speed').textContent=C.speed+'× Speed';const ticks=document.getElementById('ticks');for(let i=0;i<60;i++){const t=i*Math.PI/30,x=Math.sin(t),y=-Math.cos(t),r=i%5?128:119;let e=document.createElementNS('http://www.w3.org/2000/svg','path');e.setAttribute('d',`M${150+x*r} ${150+y*r}L${150+x*136} ${150+y*136}`);e.setAttribute('stroke','#9ec8e0');e.setAttribute('stroke-width',i%5?'2':'4');ticks.append(e)}tl.fromTo('#second',{rotation:0},{rotation:D*C.speed*6,duration:D,ease:'none'},0)}
if(C.type==='arrow'){const q={x:C.targets[0][1],y:C.targets[0][2]};function arrow(){const x=q.x,y=q.y,sx=x+235,sy=y-185;document.getElementById('shaft').setAttribute('d',`M${sx} ${sy}L${x+15} ${y-12}`);document.getElementById('tip').setAttribute('d',`M${x} ${y}L${x+16} ${y-43}L${x+44} ${y-9}Z`)};arrow();C.targets.slice(1).forEach((p,i)=>tl.fromTo(q,{x:C.targets[i][1],y:C.targets[i][2]},{x:p[1],y:p[2],duration:p[0]-C.targets[i][0],ease:'none',onUpdate:arrow,immediateRender:false},C.targets[i][0]));tl.fromTo('#arrow',{opacity:0},{opacity:1,duration:.2},0)}
</script></body></html>
