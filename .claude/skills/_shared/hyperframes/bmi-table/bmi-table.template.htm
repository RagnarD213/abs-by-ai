<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=__W__, height=__H__" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      /* Soft Blue Light BMI TABLE: full screen on the moving field. Geometry comes from build.py. */
      @font-face { font-family: "Poppins"; src: url("assets/Poppins-Bold.ttf") format("truetype"); font-weight: 700; }
      @font-face { font-family: "Poppins"; src: url("assets/Poppins-Regular.ttf") format("truetype"); font-weight: 400; }
      :root {
        --tint: rgba(22, 51, 81, 0.62);
        --line: rgb(64, 112, 153);
        --cyan: rgb(104, 197, 255);
        --white: rgb(244, 250, 255);
        --soft: rgba(244, 250, 255, 0.72);
        --spec: rgba(135, 210, 248, 0.55);
        --under: rgb(58, 82, 110);
        --normal: rgb(22, 138, 120);
        --over: rgb(214, 138, 36);
        --obese: rgb(206, 58, 58);
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: __W__px; height: __H__px; overflow: hidden; background: rgb(5, 13, 28); }
      #root { position: relative; width: 100%; height: 100%; font-family: "Poppins", sans-serif; font-weight: 700; }
      #field { position: absolute; left: 0; top: 0; width: __W__px; height: __H__px; }
      .t { position: absolute; white-space: nowrap; line-height: 1.4; }
      .t span { display: inline-block; white-space: pre; }
      #accent { position: absolute; border-radius: 3px; background: var(--cyan); transform-origin: 50% 100%; }
      #eyebrow { color: var(--cyan); letter-spacing: 2px; }
      #headline { color: var(--white); }
      #panel { position: absolute; border-radius: 36px; background: var(--tint); border: 2px solid var(--line); overflow: hidden; }
      #spec { position: absolute; top: 0; width: 220px; height: 100%; background: linear-gradient(90deg, rgba(135,210,248,0), var(--spec), rgba(135,210,248,0)); opacity: 0.18; }
      .unit { position: absolute; color: var(--cyan); font-size: 26px; line-height: 1.4; white-space: nowrap; }
      .num { position: absolute; color: var(--white); font-size: 30px; line-height: 1.4; text-align: center; white-space: nowrap; }
      .rh { position: absolute; color: var(--white); font-size: 32px; display: flex; align-items: center; justify-content: flex-end; white-space: nowrap; }
      .cell { position: absolute; }
      .cell .bg { position: absolute; left: 0; top: 0; width: 100%; height: 100%; border-radius: 12px; }
      .cell .tx { position: absolute; left: 0; top: 0; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center;
                  color: var(--white); text-shadow: 0 1px 3px rgba(0,0,0,0.6); }
      .cell.under .bg { background: var(--under); }
      .cell.under .tx { color: rgb(200, 214, 230); }
      .cell.normal .bg { background: var(--normal); }
      .cell.over .bg { background: var(--over); }
      .cell.over .tx { color: rgb(16, 22, 32); text-shadow: none; }      /* white on amber reads 2.6:1 */
      .cell.obese .bg { background: var(--obese); }
      .chip { position: absolute; border-radius: 22px; background: var(--tint); border: 2px solid var(--line); }
      .chip .sw { position: absolute; left: 22px; top: 30px; width: 44px; height: 44px; border-radius: 10px; }
      .chip .tt { position: absolute; left: 80px; top: 10px; color: var(--white); font-size: 31px; line-height: 1.4; white-space: nowrap; }
      .chip .rr { position: absolute; left: 80px; top: 52px; color: var(--soft); font-size: 25px; font-weight: 400; line-height: 1.4; white-space: nowrap; }
      #under { position: absolute; color: var(--soft); font-size: 24px; font-weight: 400; line-height: 1.4; white-space: nowrap; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="__ID__" data-start="0" data-duration="__DUR__" data-width="__W__" data-height="__H__">
      <canvas id="field" width="__W__" height="__H__"></canvas>
      <div id="group">
        <div id="accent"></div>
        <div id="eyebrow" class="t"></div>
        <div id="headline" class="t"></div>
        <div id="panel"><div id="spec"></div></div>
        <div id="grid"></div>
        <div id="legend"></div>
        <div id="under"></div>
      </div>
    </div>
    <script>
      const CFG = __CFG__;
      const D = CFG.dur;
      const px = v => v + "px";
      const place = (e, x, y, w, h) => Object.assign(e.style, { left: px(x), top: px(y), width: w == null ? "" : px(w), height: h == null ? "" : px(h) });
      const $ = id => document.getElementById(id);
      const mk = (cls, parent) => { const e = document.createElement("div"); if (cls) e.className = cls; (parent || $("grid")).appendChild(e); return e; };
      const words = (e, s) => s.split(" ").map((w, i, a) => { const sp = document.createElement("span"); sp.textContent = w + (i < a.length - 1 ? " " : ""); e.appendChild(sp); return sp; });
      // ---------- the moving Soft Blue field (softblue.field, same formula; blob size constant against the short side) ----------
      const CW = __W__, CH = __H__, GW = Math.round(CW / 4), GH = Math.round(CH / 4), cv = $("field"), ctx = cv.getContext("2d");
      const off = document.createElement("canvas"); off.width = GW; off.height = GH;
      const octx = off.getContext("2d"), img = octx.createImageData(GW, GH);
      let seed = 8; const rnd = () => { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; };
      const noise = new Float32Array(GW * GH);
      for (let i = 0; i < noise.length; i++) { const u = Math.max(1e-9, rnd()), v = rnd(); noise[i] = 0.42 * Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); }
      const FS = Math.min(CW, CH) / 1080, SX = CW / (1920 * FS), SY = CH / (1080 * FS);
      function drawField(t) {
        const gx = .14 + .13 * Math.sin(t * .65), gy = .2 + .13 * Math.cos(t * .4), hx = .83 + .12 * Math.cos(t * .6), hy = .88;
        const d = img.data;
        for (let y = 0; y < GH; y++) {
          const yy = y / GH, gyv = (yy - gy) * SY * (yy - gy) * SY / .35, kyv = (yy - hy) * SY * (yy - hy) * SY / .18;
          for (let x = 0; x < GW; x++) {
            const xx = x / GW, i = y * GW + x;
            const g = Math.exp(-((xx - gx) * SX * (xx - gx) * SX / .18 + gyv)), k = Math.exp(-((xx - hx) * SX * (xx - hx) * SX / .12 + kyv));
            const n = noise[i], o = i * 4;
            d[o] = Math.min(255, Math.max(0, 5 + g * 5 + k * 3 + n)) | 0;
            d[o + 1] = Math.min(255, Math.max(0, 13 + g * 53 + k * 26 + n)) | 0;
            d[o + 2] = Math.min(255, Math.max(0, 28 + g * 94 + k * 62 + n)) | 0;
            d[o + 3] = 255;
          }
        }
        octx.putImageData(img, 0, 0);
        ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = "low";
        ctx.drawImage(off, 0, 0, CW, CH);
      }

      const tl = gsap.timeline({ paused: true });
      const clock = { t: 0 };
      drawField(0);
      tl.fromTo(clock, { t: 0 }, { t: D, duration: D, ease: "none", onUpdate: () => drawField(clock.t) }, 0);
      const g = $("group"); Object.assign(g.style, { position: "absolute", left: "0px", top: "0px", width: px(CW), height: px(CH) });

      // ---------- title ----------
      const acc = $("accent"); place(acc, ...CFG.accent);
      const eb = $("eyebrow"); place(eb, CFG.eyebrow.x, CFG.eyebrow.y); eb.style.fontSize = px(CFG.eyebrow.px); eb.textContent = CFG.eyebrow.s;
      const hl = $("headline"); place(hl, CFG.headline.x, CFG.headline.y); hl.style.fontSize = px(CFG.headline.px);
      const hw = words(hl, CFG.headline.s);
      tl.fromTo(acc, { scaleY: 0 }, { scaleY: 1, duration: 0.4, ease: "power2.out" }, 0.0);
      tl.fromTo(eb, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.42, ease: "expo.out" }, 0.04);
      tl.fromTo(hw, { opacity: 0, y: 26 }, { opacity: 1, y: 0, duration: 0.5, ease: "expo.out", stagger: 0.06 }, 0.12);

      // ---------- panel, headers ----------
      const [pX, pY, pW, pH] = CFG.panel;
      const panel = $("panel"); place(panel, pX, pY, pW, pH);
      tl.fromTo(panel, { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, 0.1);
      const uw = mk("unit"); place(uw, CFG.cols[0].x, CFG.unit_y); uw.textContent = CFG.units.w;
      const uh = mk("unit"); place(uh, CFG.hdr_x, CFG.unit_y); uh.textContent = CFG.units.h;
      tl.fromTo([uw, uh], { opacity: 0 }, { opacity: 1, duration: 0.35, ease: "power2.out" }, 0.3);
      const colEls = CFG.cols.map(c => { const e = mk("num"); place(e, c.x, CFG.num_y, c.w); e.textContent = c.s; return e; });
      const rowEls = CFG.rows.map(r => { const e = mk("rh"); place(e, CFG.hdr_x, r.y, CFG.hdr_w - 22, r.h); e.textContent = r.s; return e; });
      tl.fromTo(colEls, { opacity: 0, y: -12 }, { opacity: 1, y: 0, duration: 0.35, ease: "power2.out", stagger: 0.035 }, 0.32);
      tl.fromTo(rowEls, { opacity: 0, x: -16 }, { opacity: 1, x: 0, duration: 0.35, ease: "power2.out", stagger: 0.035 }, 0.32);

      // ---------- cells: a diagonal wave from the top-left corner ----------
      // each cell: a colour plate (.bg, dimmed when another band is lit) and its value (.tx, stays readable)
      const byBand = { under: [], normal: [], over: [], obese: [] }, bgOf = { under: [], normal: [], over: [], obese: [] }, txOf = { under: [], normal: [], over: [], obese: [] };
      const cellEls = CFG.cells.map(c => {
        const e = mk("cell " + c.b); place(e, c.x, c.y, c.w, c.h);
        const bg = mk("bg", e), tx = mk("tx", e); tx.style.fontSize = px(CFG.cell_px); tx.textContent = c.v;
        byBand[c.b].push(e); bgOf[c.b].push(bg); txOf[c.b].push(tx);
        tl.fromTo(e, { opacity: 0, scale: 0.82 }, { opacity: 1, scale: 1, duration: 0.38, ease: "back.out(1.4)" }, 0.5 + c.d * 0.055);
        return e;
      });

      // ---------- legend ----------
      const chips = {};
      CFG.legend.forEach((L, i) => {
        const e = mk("chip", $("legend")); place(e, L.x, L.y, L.w, L.h);
        const sw = mk("sw", e); sw.style.background = getComputedStyle(document.documentElement).getPropertyValue("--" + L.b);
        const tt = mk("tt", e); tt.textContent = L.t;
        const rr = mk("rr", e); rr.textContent = L.r;
        chips[L.b] = e;
        tl.fromTo(e, { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, 1.25 + i * 0.12);
      });
      const un = $("under"); place(un, CFG.under.x, CFG.under.y); un.textContent = CFG.under.s;
      tl.fromTo(un, { opacity: 0 }, { opacity: 1, duration: 0.4 }, 1.7);

      // ---------- beats: the named band lights up, the others dim; the lit band breathes until the next beat ----------
      const bands = ["normal", "over", "obese"];
      CFG.beats.forEach(([name, t], i) => {
        const b = name === "overweight" ? "over" : name;
        const tEnd = i + 1 < CFG.beats.length ? CFG.beats[i + 1][1] : D;
        const others = [].concat(...bands.filter(x => x !== b).map(x => bgOf[x]), bgOf.under);
        tl.to(others, { opacity: 0.3, duration: 0.25, ease: "power2.out" }, t);
        // amber carries dark numbers; once it is dimmed they turn light, and dark again when amber is lit
        if (b !== "over") tl.to(txOf.over, { color: "rgb(226, 234, 244)", duration: 0.25 }, t);
        else tl.to(txOf.over, { color: "rgb(16, 22, 32)", duration: 0.25 }, t);
        tl.to(Object.keys(chips).filter(x => x !== b).map(x => chips[x]), { opacity: 0.45, scale: 1, boxShadow: "0 0 0px rgba(104,197,255,0)", duration: 0.25 }, t);
        tl.to(bgOf[b], { opacity: 1, duration: 0.22, ease: "power2.out" }, t);
        tl.fromTo(byBand[b], { scale: 1 }, { scale: 1.08, duration: 0.22, ease: "power2.out", immediateRender: false }, t);
        tl.to(byBand[b], { scale: 1, duration: 0.35, ease: "back.out(1.6)" }, t + 0.22);
        tl.fromTo(chips[b], { opacity: 0.45, scale: 1 }, { opacity: 1, scale: 1.05, boxShadow: "0 0 30px rgba(104,197,255,0.7)", duration: 0.25, ease: "power2.out", immediateRender: false }, t);
        tl.to(chips[b], { scale: 1, boxShadow: "0 0 12px rgba(104,197,255,0.3)", duration: 0.4, ease: "sine.inOut" }, t + 0.25);
        const span = tEnd - (t + 0.6);
        const n = Math.floor(span / 1.4);
        if (n >= 1) tl.fromTo(byBand[b], { filter: "brightness(1)" }, { filter: "brightness(1.16)", duration: 0.7, ease: "sine.inOut", yoyo: true, repeat: n * 2 - 1, immediateRender: false }, t + 0.6);
      });

      // ---------- always moving: the glass catches a sweeping light; the block drifts a few px ----------
      const sweeps = Math.max(1, Math.round(D / 2.6));
      tl.fromTo("#spec", { x: -260 }, { x: pW + 40, duration: D / sweeps, ease: "sine.inOut", repeat: sweeps - 1 }, 0);
      tl.fromTo(g, { y: 0 }, { y: CFG.drift, duration: D, ease: "sine.inOut" }, 0);

      window.__timelines["__ID__"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
