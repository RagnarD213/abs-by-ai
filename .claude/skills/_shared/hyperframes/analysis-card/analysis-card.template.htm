<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=__W__, height=__H__" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      /* Soft Blue Light ANALYSIS CARD (Dan, 2026-10-14: "Redo the analysis card in our graphics in soft blue light with our
         hyperframes. Make that standardized with the rest of our videos."). The RA-01 content, unchanged: the subject's
         picture, a scan line, BODY FAT / FAT TO LOSE / MUSCLE TO GAIN bars, the plan band, no printed numbers, one label
         chip clear of the person. An opaque scene on the moving field: it cuts in and out hard and never stops moving. */
      @font-face { font-family: "Poppins"; src: url("assets/Poppins-Bold.ttf") format("truetype"); font-weight: 700; }
      @font-face { font-family: "Poppins"; src: url("assets/Poppins-Regular.ttf") format("truetype"); font-weight: 400; }
      :root {
        --tint: rgba(22, 51, 81, 0.498);       /* glass over the field (before-card) */
        --line: rgb(64, 112, 153);             /* GLASS_LINE */
        --cyan: rgb(104, 197, 255);            /* CYAN */
        --cyan2: rgb(151, 223, 253);           /* LT_CYAN, the light end of a bar */
        --white: rgb(244, 250, 255);           /* WHITE */
        --spec: rgb(135, 210, 248);            /* SPECULAR */
        --chip: rgb(6, 17, 30);                /* disclosure chip, and the type on the cyan plan band */
        --track: rgb(12, 33, 58);              /* an empty bar */
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: __W__px; height: __H__px; overflow: hidden; background: rgb(5, 13, 28); }
      #root { position: relative; width: 100%; height: 100%; font-family: "Poppins", sans-serif; font-weight: 700; background: rgb(5, 13, 28); }
      #field { position: absolute; left: 0; top: 0; width: __W__px; height: __H__px; }
      #photoGroup, #cardGroup { position: absolute; left: 0; top: 0; width: __W__px; height: __H__px; }
      #shadow { position: absolute; border-radius: 36px; background: rgba(0, 2, 12, 0.43); filter: blur(10px); }
      #frame { position: absolute; border-radius: 26px; background: rgb(42, 80, 113); border: 2px solid rgba(118, 183, 222, 0.59); }
      #clip { position: absolute; overflow: hidden; border-radius: 16px; }
      #clip img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: 50% 0%; }
      #wash { position: absolute; left: 0; top: 0; width: 100%; height: 100%; transform-origin: 50% 0%;
        background: linear-gradient(180deg, rgba(104, 197, 255, 0) 0%, rgba(104, 197, 255, 0.10) 70%, rgba(104, 197, 255, 0.26) 100%); }
      #scan { position: absolute; left: -2%; top: -3px; width: 104%; height: 6px; border-radius: 3px; background: rgb(215, 242, 255);
        box-shadow: 0 0 10px 3px rgba(104, 197, 255, 0.95), 0 0 34px 10px rgba(104, 197, 255, 0.55); }
      .bracket { position: absolute; width: 54px; height: 54px; border-color: var(--cyan); border-style: solid; border-width: 0; }
      #chip { position: absolute; border-radius: 22px; background: var(--chip); }
      #chip div { position: absolute; font-weight: 400; line-height: 1.4; color: var(--white); white-space: nowrap; }
      #card { position: absolute; border-radius: 30px; background: var(--tint); border: 1px solid var(--line); overflow: hidden; }
      #spec { position: absolute; top: 1px; width: 180px; height: 4px; border-radius: 2px; background: var(--spec); }
      #sweep { position: absolute; top: -40%; width: 240px; height: 180%; transform: rotate(18deg);
        background: linear-gradient(90deg, rgba(170, 225, 255, 0), rgba(170, 225, 255, 0.16) 50%, rgba(170, 225, 255, 0)); }
      .row { position: absolute; }
      .lab { position: absolute; white-space: nowrap; line-height: 1.4; color: var(--white); }
      .track { position: absolute; border-radius: 999px; background: var(--track); border: 1px solid var(--line); overflow: hidden; }
      .fill { position: absolute; left: 0; top: 0; height: 100%; width: 100%; transform-origin: 0% 50%; border-radius: 999px;
        background: linear-gradient(90deg, var(--cyan), var(--cyan2)); box-shadow: 0 0 14px rgba(104, 197, 255, 0.55); }
      #band { position: absolute; border-radius: 22px; background: linear-gradient(90deg, var(--cyan), var(--cyan2));
        box-shadow: 0 0 26px rgba(104, 197, 255, 0.45); }
      #bandText { position: absolute; white-space: nowrap; line-height: 1.4; color: var(--chip); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="__ID__" data-start="0" data-duration="__DUR__" data-width="__W__" data-height="__H__">
      <canvas id="field" width="__W__" height="__H__"></canvas>
      <div id="photoGroup">
        <div id="shadow"></div>
        <div id="frame"></div>
        <div id="clip"><img id="photo" alt="" /><div id="wash"></div><div id="scan"></div></div>
        <div id="bTL" class="bracket"></div><div id="bTR" class="bracket"></div>
        <div id="bBL" class="bracket"></div><div id="bBR" class="bracket"></div>
        <div id="chip"><div id="chipText"></div></div>
      </div>
      <div id="cardGroup">
        <div id="card"><div id="spec"></div><div id="sweep"></div></div>
        <div id="rows"></div>
        <div id="band"><div id="bandText"></div></div>
      </div>
    </div>
    <script>
      const CFG = __CFG__;
      const D = CFG.dur;
      const px = v => v + "px";
      const place = (e, x, y, w, h) => Object.assign(e.style, { left: px(x), top: px(y), width: w == null ? "" : px(w), height: h == null ? "" : px(h) });

      // ---------- the moving Soft Blue field (softblue.field, same formula as before-card) ----------
      const CW = __W__, CH = __H__, GW = Math.round(CW / 4), GH = Math.round(CH / 4), cv = document.getElementById("field"), ctx = cv.getContext("2d");
      const off = document.createElement("canvas"); off.width = GW; off.height = GH;
      const octx = off.getContext("2d"), img = octx.createImageData(GW, GH);
      let seed = 8; const rnd = () => { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; };
      const noise = new Float32Array(GW * GH);
      for (let i = 0; i < noise.length; i++) { const u = Math.max(1e-9, rnd()), v = rnd(); noise[i] = 0.42 * Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); }
      const FS = Math.min(CW, CH) / 1080, SX = CW / (1920 * FS), SY = CH / (1080 * FS);
      function drawField(t) {
        const gx = .14 + .13 * Math.sin(t * .65), gy = .2 + .13 * Math.cos(t * .4), hx = .83 + .12 * Math.cos(t * .6), hy = .88;
        const d = img.data;
        for (let y = 0; y < GH; y++) {
          const yy = y / GH, gyv = (yy - gy) * SY * (yy - gy) * SY / .35, kyv = (yy - hy) * SY * (yy - hy) * SY / .18;
          for (let x = 0; x < GW; x++) {
            const xx = x / GW, i = y * GW + x;
            const g = Math.exp(-((xx - gx) * SX * (xx - gx) * SX / .18 + gyv)), k = Math.exp(-((xx - hx) * SX * (xx - hx) * SX / .12 + kyv));
            const n = noise[i], o = i * 4;
            d[o] = Math.min(255, Math.max(0, 5 + g * 5 + k * 3 + n)) | 0;
            d[o + 1] = Math.min(255, Math.max(0, 13 + g * 53 + k * 26 + n)) | 0;
            d[o + 2] = Math.min(255, Math.max(0, 28 + g * 94 + k * 62 + n)) | 0;
            d[o + 3] = 255;
          }
        }
        octx.putImageData(img, 0, 0);
        ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = "low";
        ctx.drawImage(off, 0, 0, CW, CH);
      }

      // ---------- the picture, its scanner frame and its chip (all there from frame 0: the card cuts in hard) ----------
      const P = CFG.photo;
      place(document.getElementById("shadow"), P.x - 4, P.y + 2, P.w + 24, P.h + 24);
      place(document.getElementById("frame"), P.x - 10, P.y - 10, P.w + 20, P.h + 20);
      place(document.getElementById("clip"), P.x, P.y, P.w, P.h);
      document.getElementById("photo").src = P.src;
      const BK = 18, BW = 5;
      const brk = { bTL: [P.x - BK, P.y - BK, "top", "left"], bTR: [P.x + P.w + BK - 54, P.y - BK, "top", "right"],
                    bBL: [P.x - BK, P.y + P.h + BK - 54, "bottom", "left"], bBR: [P.x + P.w + BK - 54, P.y + P.h + BK - 54, "bottom", "right"] };
      for (const [id, [x, y, v, h]] of Object.entries(brk)) {
        const e = document.getElementById(id); place(e, x, y);
        e.style["border-" + v + "-width"] = px(BW); e.style["border-" + h + "-width"] = px(BW);
        e.style["border-" + v + "-" + h + "-radius"] = px(14);
      }
      const chip = document.getElementById("chip");
      if (CFG.chip) {
        const C = CFG.chip; place(chip, C.x, C.y, C.w, C.h);
        const ct = document.getElementById("chipText"); ct.textContent = C.s;
        Object.assign(ct.style, { left: px(C.pad), top: px(C.ty), fontSize: px(C.px) });
      } else chip.style.display = "none";

      // ---------- the glass card: three label + bar rows, then the plan band ----------
      const [kx, ky, kw, kh] = CFG.card;
      place(document.getElementById("card"), kx, ky, kw, kh);
      const rowEls = CFG.rows.map(r => {
        const g = document.createElement("div"); g.className = "row"; place(g, 0, 0);
        const l = document.createElement("div"); l.className = "lab"; l.textContent = r.s; place(l, r.lx, r.ly); l.style.fontSize = px(r.px);
        const tr = document.createElement("div"); tr.className = "track"; place(tr, r.bx, r.by, r.bw, r.bh);
        const f = document.createElement("div"); f.className = "fill"; tr.appendChild(f);
        g.appendChild(l); document.getElementById("rows").appendChild(g); document.getElementById("rows").appendChild(tr);
        return { g, tr, f, r };
      });
      const BD = CFG.band, band = document.getElementById("band"), bt = document.getElementById("bandText");
      place(band, BD.x, BD.y, BD.w, BD.h); bt.textContent = BD.s;
      Object.assign(bt.style, { left: px(BD.tx), top: px(BD.ty), fontSize: px(BD.px) });

      const tl = gsap.timeline({ paused: true });
      const clock = { t: 0 };
      drawField(0);
      tl.fromTo(clock, { t: 0 }, { t: D, duration: D, ease: "none", onUpdate: () => drawField(clock.t) }, 0);
      // never still: a slow push on the picture, a few px of drift on the card
      tl.fromTo("#photo", { scale: 1 }, { scale: CFG.push, duration: D, ease: "power1.inOut", transformOrigin: "50% 30%" }, 0);
      tl.fromTo("#cardGroup", { y: 0 }, { y: CFG.drift, duration: D, ease: "sine.inOut" }, 0);
      // the scan: the line sweeps the picture once, the wash follows it, then both fade; the brackets pulse as it lands
      const S = CFG.scan;
      tl.fromTo("#scan", { y: 0 }, { y: P.h, duration: S[1] - S[0], ease: "power1.inOut" }, S[0]);
      tl.fromTo("#wash", { scaleY: 0 }, { scaleY: 1, duration: S[1] - S[0], ease: "power1.inOut" }, S[0]);
      tl.fromTo(["#scan", "#wash"], { opacity: 1 }, { opacity: 0, duration: 0.3, ease: "power1.out", immediateRender: false }, S[1]);
      tl.fromTo(".bracket", { opacity: 0.55, scale: 1 }, { opacity: 1, scale: 1.08, duration: 0.18, ease: "power2.out", yoyo: true, repeat: 1, immediateRender: false }, S[1] - 0.05);
      // the glass: specular line runs its top edge; one light sweep when the band lands
      const specN = Math.max(1, Math.round(D / 2.4));
      tl.fromTo("#spec", { x: 40 }, { x: kw - 40 - 180 - 40, duration: D / specN, ease: "sine.inOut", yoyo: true, repeat: specN - 1 }, 0);
      // rows land on their words: the label rises, the bar fills to its level (no number is ever printed), then creeps on
      // the three empty tracks are there from the cut (the card reads as a measurement waiting to fill), dimmed
      rowEls.forEach(({ g, tr, f, r }) => {
        tl.fromTo(tr, { opacity: 0.45 }, { opacity: 1, duration: 0.3, ease: "power1.out" }, r.t);
        tl.fromTo(g, { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.36, ease: "expo.out" }, r.t);
        tl.fromTo(f, { scaleX: 0 }, { scaleX: r.v, duration: 0.7, ease: "power3.out" }, r.t + 0.08);
        const rest = D - (r.t + 0.8);
        // immediateRender false: a later fromTo would otherwise write its start value at time 0 (the bars showed filled
        // on the card's first frame, RA-14 round 3)
        if (rest > 0.2) tl.fromTo(f, { scaleX: r.v }, { scaleX: r.v + 0.05, duration: rest, ease: "none", immediateRender: false }, r.t + 0.8);
      });
      tl.fromTo("#band", { opacity: 0, y: 20, scale: 0.96 }, { opacity: 1, y: 0, scale: 1, duration: 0.38, ease: "back.out(1.6)" }, BD.t);
      tl.fromTo("#sweep", { x: -320 }, { x: kw + 80, duration: 0.8, ease: "power1.inOut" }, Math.min(D - 0.8, BD.t + 0.05));

      window.__timelines["__ID__"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
