<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=__W__, height=__H__" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      /* Soft Blue Light CTA BUTTON: a glass button over footage (mode "content" + a "mask" pass for the blur, like the lower third), or full screen on the field (CFG.full). */
      @font-face { font-family: "Poppins"; src: url("assets/Poppins-Bold.ttf") format("truetype"); font-weight: 700; }
      @font-face { font-family: "Poppins"; src: url("assets/Poppins-Regular.ttf") format("truetype"); font-weight: 400; }
      :root {
        --tint: rgba(22, 51, 81, 0.498);       /* glass over the field: 0.92 x the 0.54 tint blend */
        --glass: rgba(22, 51, 81, 0.54);       /* GLASS_TINT over footage (the blur comes from the _mask pass) */
        --line: rgb(64, 112, 153);             /* GLASS_LINE */
        --cyan: rgb(104, 197, 255);            /* CYAN */
        --white: rgb(244, 250, 255);           /* WHITE */
        --spec: rgb(135, 210, 248);            /* SPECULAR */
        --chip: rgb(6, 17, 30);                /* disclosure chip */
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: __W__px; height: __H__px; overflow: hidden; background: transparent; }
      #root { position: relative; width: 100%; height: 100%; font-family: "Poppins", sans-serif; font-weight: 700; }
      #field { position: absolute; left: 0; top: 0; width: __W__px; height: __H__px; }
      .t { position: absolute; white-space: nowrap; line-height: 1.4; }
      .t span { display: inline-block; white-space: pre; }
      #enter { position: absolute; left: 0; top: 0; width: __W__px; height: __H__px; }
      #btn { position: absolute; background: var(--glass); border: 1px solid var(--line); overflow: hidden; }
      #spec { position: absolute; top: 1px; width: 180px; height: 4px; border-radius: 2px; background: var(--spec); }
      #glow { position: absolute; border-radius: 40px; box-shadow: 0 0 0px rgba(104, 197, 255, 0); }
      #top { color: var(--cyan); }
      #big { color: var(--white); }
      #arrow { position: absolute; color: var(--cyan); line-height: 1.4; }
      .mask #btn { background: rgba(255, 255, 255, 0.92); border-color: transparent; }
      .mask #spec, .mask .content { visibility: hidden; }
      .full #btn { background: var(--tint); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="__ID__" data-start="0" data-duration="__DUR__" data-width="__W__" data-height="__H__">
      <canvas id="field" width="__W__" height="__H__"></canvas>
      <div id="enter">
        <div id="glow" class="content"></div>
        <div id="btn"><div id="spec"></div></div>
        <div id="top" class="t content"></div>
        <div id="big" class="t content"></div>
        <div id="arrow" class="content">&#8250;</div>
      </div>
    </div>
    <script>
      const CFG = __CFG__;
      const D = CFG.dur;
      const px = v => v + "px";
      const place = (e, x, y, w, h) => Object.assign(e.style, { left: px(x), top: px(y), width: w == null ? "" : px(w), height: h == null ? "" : px(h) });
      const $ = id => document.getElementById(id);
      const words = (e, s) => s.split(" ").map((w, i, a) => { const sp = document.createElement("span"); sp.textContent = w + (i < a.length - 1 ? " " : ""); e.appendChild(sp); return sp; });
      // ---------- the moving Soft Blue field (softblue.field, same formula; blob size constant against the short side) ----------
      const CW = __W__, CH = __H__, GW = Math.round(CW / 4), GH = Math.round(CH / 4), cv = $("field"), ctx = cv.getContext("2d");
      const off = document.createElement("canvas"); off.width = GW; off.height = GH;
      const octx = off.getContext("2d"), img = octx.createImageData(GW, GH);
      let seed = 8; const rnd = () => { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; };
      const noise = new Float32Array(GW * GH);
      for (let i = 0; i < noise.length; i++) { const u = Math.max(1e-9, rnd()), v = rnd(); noise[i] = 0.42 * Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); }
      const FS = Math.min(CW, CH) / 1080, SX = CW / (1920 * FS), SY = CH / (1080 * FS);
      function drawField(t) {
        const gx = .14 + .13 * Math.sin(t * .65), gy = .2 + .13 * Math.cos(t * .4), hx = .83 + .12 * Math.cos(t * .6), hy = .88;
        const d = img.data;
        for (let y = 0; y < GH; y++) {
          const yy = y / GH, gyv = (yy - gy) * SY * (yy - gy) * SY / .35, kyv = (yy - hy) * SY * (yy - hy) * SY / .18;
          for (let x = 0; x < GW; x++) {
            const xx = x / GW, i = y * GW + x;
            const g = Math.exp(-((xx - gx) * SX * (xx - gx) * SX / .18 + gyv)), k = Math.exp(-((xx - hx) * SX * (xx - hx) * SX / .12 + kyv));
            const n = noise[i], o = i * 4;
            d[o] = Math.min(255, Math.max(0, 5 + g * 5 + k * 3 + n)) | 0;
            d[o + 1] = Math.min(255, Math.max(0, 13 + g * 53 + k * 26 + n)) | 0;
            d[o + 2] = Math.min(255, Math.max(0, 28 + g * 94 + k * 62 + n)) | 0;
            d[o + 3] = 255;
          }
        }
        octx.putImageData(img, 0, 0);
        ctx.globalCompositeOperation = "source-over";
        ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = "low";
        ctx.drawImage(off, 0, 0, CW, CH);
        if (typeof afterField === "function") afterField(ctx);
      }

      const tl = gsap.timeline({ paused: true });
      const root = $("root");
      if (CFG.mode === "mask") root.classList.add("mask");
      if (CFG.full && CFG.mode !== "mask") { root.classList.add("full"); const clock = { t: 0 }; drawField(0); tl.fromTo(clock, { t: 0 }, { t: D, duration: D, ease: "none", onUpdate: () => drawField(clock.t) }, 0); }
      else $("field").style.display = "none";
      const [bx, by, bw, bh] = CFG.btn;
      place($("btn"), bx, by, bw, bh); $("btn").style.borderRadius = px(CFG.radius);
      place($("glow"), bx, by, bw, bh); $("glow").style.borderRadius = px(CFG.radius);
      const topEl = $("top"), bigEl = $("big"), ar = $("arrow");      // (`top` is a window property: not a legal const name)
      place(topEl, CFG.top.x, CFG.top.y); topEl.style.fontSize = px(CFG.top.px); const tw = words(topEl, CFG.top.s);
      place(bigEl, CFG.big.x, CFG.big.y); bigEl.style.fontSize = px(CFG.big.px); const bwd = words(bigEl, CFG.big.s);
      place(ar, CFG.arrow.x, CFG.arrow.y); ar.style.fontSize = px(CFG.arrow.px);
      const specN = Math.max(1, Math.round(D / 2.4));
      tl.fromTo("#spec", { x: 40 }, { x: bw - 40 - 180 - 40, duration: D / specN, ease: "sine.inOut", yoyo: true, repeat: specN - 1 }, 0);
      // enter: the button rises and settles; the two lines rise in turn; the arrow nudges; one soft glow, then a slow breath
      tl.fromTo("#enter", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 0);
      tl.fromTo(tw, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.42, ease: "expo.out", stagger: 0.04 }, 0.25);
      tl.fromTo(bwd, { opacity: 0, y: 22 }, { opacity: 1, y: 0, duration: 0.42, ease: "expo.out", stagger: 0.06 }, 0.42);
      tl.fromTo(ar, { opacity: 0, x: -14 }, { opacity: 1, x: 0, duration: 0.4, ease: "back.out(1.5)" }, 0.75);
      tl.fromTo("#glow", { boxShadow: "0 0 0px rgba(104,197,255,0)" }, { boxShadow: "0 0 34px rgba(104,197,255,0.75)", duration: 0.25, ease: "power2.out" }, 0.95);
      tl.to("#glow", { boxShadow: "0 0 10px rgba(104,197,255,0.25)", duration: 0.8, ease: "sine.inOut" }, 1.2);
      const nudges = Math.max(0, Math.floor((D - 2.2) / 1.6));
      if (nudges) tl.fromTo(ar, { x: 0 }, { x: 10, duration: 0.8, ease: "sine.inOut", yoyo: true, repeat: nudges * 2 - 1, immediateRender: false }, 1.4);
      // exit: fade and drop, gone exactly on the out (a CTA that runs to the end of the film holds instead)
      if (!CFG.hold_out) tl.fromTo("#enter", { opacity: 1, y: 0 }, { opacity: 0, y: 10, duration: 0.33, ease: "power2.in", immediateRender: false }, D - 0.33);

      window.__timelines["__ID__"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
