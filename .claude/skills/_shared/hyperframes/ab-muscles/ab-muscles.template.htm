<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=1920,height=1080">
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script><style>
@font-face{font-family:Poppins;src:url('assets/Poppins-Bold.ttf');font-weight:700}@font-face{font-family:Poppins;src:url('assets/Poppins-Regular.ttf');font-weight:400}
*{box-sizing:border-box;margin:0}html,body{width:1920px;height:1080px;overflow:hidden;background:transparent}
#root{width:1920px;height:1080px;position:relative;font-family:Poppins;color:#f4faff;font-weight:700}#field{position:absolute;inset:0}
#title{position:absolute;left:100px;top:56px;font-size:62px;line-height:1.4}#sub{position:absolute;left:100px;top:151px;color:#9bbbd6;font-size:26px;font-weight:400}
#panels{position:absolute;left:100px;top:220px;display:flex;gap:24px}.panel{position:relative;width:412px;height:650px;background:rgba(10,38,72,.94);border:2px solid #407099;border-radius:28px;overflow:hidden}
.name{font-size:29px;text-align:center;line-height:1.4;height:88px;padding-top:23px}.layer{position:absolute;left:0;right:0;bottom:30px;text-align:center;color:#9bbbd6;font-size:24px;font-weight:400}
svg{position:absolute;left:50px;top:116px;width:310px;height:420px}.muscle{fill:#f28d75;stroke:#ffc9bb;stroke-width:1.3}.fiber{fill:none;stroke:#ffd8cb;stroke-width:1.4;opacity:.7}.torso{fill:#1d4364;stroke:#6e9dc1;stroke-width:2.3}.anatomyline{fill:none;stroke:#7297b2;stroke-width:1.5;opacity:.65}
.spec{position:absolute;top:0;width:140px;height:3px;background:linear-gradient(90deg,transparent,#87d2f8,transparent)}.active{position:absolute;inset:0;border:3px solid #68c5ff;border-radius:27px;opacity:0;box-shadow:inset 0 0 35px rgba(104,197,255,.12)}
#caption{position:absolute;left:100px;top:912px;width:1720px;text-align:center;font-size:42px;color:#b8e3ff;line-height:1.4}
#note{position:absolute;left:100px;top:1000px;width:1720px;text-align:center;font-size:28px;font-weight:400;color:#acccdf}
</style></head><body><div id="root" data-composition-id="__ID__" data-start="0" data-duration="__DUR__" data-width="1920" data-height="1080">
<canvas id="field" width="1920" height="1080"></canvas><div id="title"></div><div id="sub">Separate Layers Shown In Front View</div><div id="panels"></div><div id="caption"></div><div id="note"></div></div>
<script>
const C=__CFG__,D=C.dur,ctx=document.getElementById('field').getContext('2d');document.getElementById('title').textContent=C.title;
const torso='<path class="torso" d="M105 15 L125 30 L185 30 L205 15 Q238 33 278 52 L263 119 Q245 149 245 180 L233 254 Q234 296 249 342 L207 396 Q185 370 155 367 Q125 370 103 396 L61 342 Q76 296 77 254 L65 180 Q65 149 47 119 L32 52 Q72 33 105 15Z"/><path class="anatomyline" d="M155 48 V350 M73 120 Q112 145 155 117 Q198 145 237 120 M83 306 Q155 337 227 306"/>';
function muscle(n){if(n===0){let z='';for(let y=145;y<290;y+=53){z+=`<path class="muscle" d="M113 ${y} Q130 ${y-6} 148 ${y} L148 ${y+40} Q129 ${y+47} 111 ${y+39}Z M162 ${y} Q180 ${y-6} 197 ${y} L199 ${y+39} Q181 ${y+47} 162 ${y+40}Z"/>`;}return z;}
if(n===1||n===2){let z='<path class="muscle" d="M72 144 Q92 159 111 166 L108 299 L84 330 Q75 286 82 251Z M238 144 Q218 159 199 166 L202 299 L226 330 Q235 286 228 251Z"/>';for(let y=158;y<292;y+=18){const q=n===1?25:-25;z+=`<path class="fiber" d="M79 ${y} L109 ${y+q} M231 ${y} L201 ${y+q}"/>`;}return z;}
let z='<path class="muscle" d="M78 180 Q155 205 232 180 L222 327 Q155 352 88 327Z"/>';for(let y=198;y<325;y+=15)z+=`<path class="fiber" d="M85 ${y} Q155 ${y+18} 225 ${y}"/>`;return z;}
const names=['Rectus<br>Abdominis','External<br>Obliques','Internal<br>Obliques','Transversus<br>Abdominis'],layers=['Six-Pack Muscle','Outer Side Layer','Inner Side Layer','Deep Layer'];
const panels=[];names.forEach((name,i)=>{const p=document.createElement('div');p.className='panel';p.innerHTML='<div class="name">'+name+'</div><svg viewBox="0 0 310 420">'+torso+'<g class="tissue">'+muscle(i)+'</g></svg><div class="layer">'+layers[i]+'</div><div class="spec"></div><div class="active"></div>';document.getElementById('panels').appendChild(p);const sv=p.querySelector('svg'),cp=document.createElementNS('http://www.w3.org/2000/svg','clipPath');cp.id='tissue-clip-'+i;cp.appendChild(p.querySelector('.muscle').cloneNode(true));sv.appendChild(cp);p.querySelectorAll('.fiber').forEach(f=>f.setAttribute('clip-path','url(#'+cp.id+')'));panels.push(p);});
function field(t){ctx.fillStyle='#050d1c';ctx.fillRect(0,0,1920,1080);const x=650+320*Math.sin(t*.2),y=550+200*Math.cos(t*.26),g=ctx.createRadialGradient(x,y,0,x,y,1200);g.addColorStop(0,'#214f80');g.addColorStop(1,'#050d1c');ctx.fillStyle=g;ctx.fillRect(0,0,1920,1080);const h=ctx.createRadialGradient(1750,200+100*Math.sin(t*.3),0,1750,200,900);h.addColorStop(0,'rgba(56,125,180,.25)');h.addColorStop(1,'rgba(5,13,28,0)');ctx.fillStyle=h;ctx.fillRect(0,0,1920,1080);}
const tl=gsap.timeline({paused:true});window.__timelines=window.__timelines||{};window.__timelines['__ID__']=tl;const clock={t:0};
tl.fromTo(clock,{t:0},{t:D,duration:D,ease:'none',onUpdate:()=>{field(clock.t);let state=C.states[0];for(const s of C.states)if(clock.t>=s.at)state=s;document.getElementById('caption').textContent=state.caption;document.getElementById('note').textContent=state.note||'';panels.forEach((p,i)=>{const active=state.active.includes(i);p.querySelector('.active').style.opacity=active?(.5+.18*Math.sin(clock.t*2)):0;p.querySelector('.tissue').style.opacity=active?1:.28;});}},0);
panels.forEach((p,i)=>{tl.fromTo(p,{opacity:0,y:24},{opacity:1,y:0,duration:.42,ease:'power2.out'},C.reveal[i]);tl.fromTo(p.querySelector('.spec'),{x:-150},{x:412,duration:D,ease:'none'},0);});
tl.fromTo('#title,#sub,#caption',{opacity:0,y:15},{opacity:1,y:0,duration:.45,ease:'power2.out'},0);tl.fromTo('#panels,#caption',{opacity:1},{opacity:0,duration:.28,immediateRender:false},D-.28);field(0);
</script></body></html>
