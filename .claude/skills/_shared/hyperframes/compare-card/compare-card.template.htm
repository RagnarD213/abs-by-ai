<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=__W__, height=__H__" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      /* Soft Blue Light COMPARE CARD: two stacked glass panels (option A, option B), each a header and rows that land on the
         words that name them, on the moving field. Built for a 9:16 short's picture area (SL-09, 2026-10-18); geometry from build.py. */
      @font-face { font-family: "Poppins"; src: url("assets/Poppins-Bold.ttf") format("truetype"); font-weight: 700; }
      @font-face { font-family: "Poppins"; src: url("assets/Poppins-Regular.ttf") format("truetype"); font-weight: 400; }
      :root {
        --tint: rgba(22, 51, 81, 0.498);
        --line: rgb(64, 112, 153);
        --cyan: rgb(104, 197, 255);
        --white: rgb(244, 250, 255);
        --spec: rgb(135, 210, 248);
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: __W__px; height: __H__px; overflow: hidden; background: rgb(5, 13, 28); }
      #root { position: relative; width: 100%; height: 100%; font-family: "Poppins", sans-serif; font-weight: 700; }
      #field { position: absolute; left: 0; top: 0; width: __W__px; height: __H__px; }
      .t { position: absolute; white-space: nowrap; line-height: 1.4; }
      #accent { position: absolute; height: 8px; border-radius: 3px; background: var(--cyan); transform-origin: 0% 50%; }
      #eyebrow { color: var(--cyan); letter-spacing: 2px; }
      .panel { position: absolute; border-radius: 36px; background: var(--tint); border: 2px solid var(--line); overflow: hidden; }
      .panel .head { position: absolute; color: var(--cyan); line-height: 1.4; white-space: nowrap; }
      .panel .div { position: absolute; height: 3px; border-radius: 2px; background: rgba(244, 250, 255, 0.85); transform-origin: 0% 50%; }
      .panel .spec { position: absolute; top: 0; width: 220px; height: 3px; background: linear-gradient(90deg, rgba(135,210,248,0), rgba(135,210,248,0.95), rgba(135,210,248,0)); }
      .panel .glow { position: absolute; inset: -2px; border-radius: 36px; border: 2px solid var(--spec); opacity: 0; }
      .row { position: absolute; }
      .row .ck { position: absolute; border-radius: 50%; background: rgba(104, 197, 255, 0.16); border: 2px solid var(--cyan); }
      .row .ck svg { position: absolute; left: 0; top: 0; }
      .row .s { position: absolute; color: var(--white); line-height: 1.4; white-space: nowrap; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="__ID__" data-start="0" data-duration="__DUR__" data-width="__W__" data-height="__H__">
      <canvas id="field" width="__W__" height="__H__"></canvas>
      <div id="group">
        <div id="accent"></div>
        <div id="eyebrow" class="t"></div>
        <div id="panels"></div>
      </div>
    </div>
    <script>
      const CFG = __CFG__;
      const D = CFG.dur;
      const px = v => v + "px";
      const place = (e, x, y, w, h) => Object.assign(e.style, { left: px(x), top: px(y), width: w == null ? "" : px(w), height: h == null ? "" : px(h) });
      const $ = id => document.getElementById(id);
      // ---------- the moving Soft Blue field (softblue.field, same formula as title-card) ----------
      const CW = __W__, CH = __H__, GW = Math.round(CW / 4), GH = Math.round(CH / 4), cv = $("field"), ctx = cv.getContext("2d");
      const off = document.createElement("canvas"); off.width = GW; off.height = GH;
      const octx = off.getContext("2d"), img = octx.createImageData(GW, GH);
      let seed = 8; const rnd = () => { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; };
      const noise = new Float32Array(GW * GH);
      for (let i = 0; i < noise.length; i++) { const u = Math.max(1e-9, rnd()), v = rnd(); noise[i] = 0.42 * Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); }
      const FS = Math.min(CW, CH) / 1080, SX = CW / (1920 * FS), SY = CH / (1080 * FS);
      function drawField(t) {
        const gx = .14 + .13 * Math.sin(t * .65), gy = .2 + .13 * Math.cos(t * .4), hx = .83 + .12 * Math.cos(t * .6), hy = .88;
        const d = img.data;
        for (let y = 0; y < GH; y++) {
          const yy = y / GH, gyv = (yy - gy) * SY * (yy - gy) * SY / .35, kyv = (yy - hy) * SY * (yy - hy) * SY / .18;
          for (let x = 0; x < GW; x++) {
            const xx = x / GW, i = y * GW + x;
            const g = Math.exp(-((xx - gx) * SX * (xx - gx) * SX / .18 + gyv)), k = Math.exp(-((xx - hx) * SX * (xx - hx) * SX / .12 + kyv));
            const n = noise[i], o = i * 4;
            d[o] = Math.min(255, Math.max(0, 5 + g * 5 + k * 3 + n)) | 0;
            d[o + 1] = Math.min(255, Math.max(0, 13 + g * 53 + k * 26 + n)) | 0;
            d[o + 2] = Math.min(255, Math.max(0, 28 + g * 94 + k * 62 + n)) | 0;
            d[o + 3] = 255;
          }
        }
        octx.putImageData(img, 0, 0);
        ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = "low";
        ctx.drawImage(off, 0, 0, CW, CH);
      }
      const tl = gsap.timeline({ paused: true });
      const clock = { t: 0 };
      drawField(0);
      tl.fromTo(clock, { t: 0 }, { t: D, duration: D, ease: "none", onUpdate: () => drawField(clock.t) }, 0);
      const g = $("group"); Object.assign(g.style, { position: "absolute", left: "0px", top: "0px", width: px(CW), height: px(CH) });
      const acc = $("accent"), eb = $("eyebrow");
      place(acc, CFG.accent[0], CFG.accent[1], CFG.accent[2]);
      place(eb, CFG.eyebrow.x, CFG.eyebrow.y); eb.style.fontSize = px(CFG.eyebrow.px); eb.textContent = CFG.eyebrow.s;
      tl.fromTo(acc, { scaleX: 0 }, { scaleX: 1, duration: 0.45, ease: "power2.out" }, 0.05);
      tl.fromTo(eb, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.42, ease: "expo.out" }, 0.08);
      // each panel: rises in on its header's word; its divider wipes; rows land on their words; while it is the newest panel a
      // light travels its top edge (finite repeats) and its border breathes, so the card keeps moving for its whole time on screen
      CFG.panels.forEach((P, pi) => {
        const e = document.createElement("div"); e.className = "panel"; place(e, P.x, P.y, P.w, P.h);
        const h = document.createElement("div"); h.className = "head"; h.textContent = P.head; h.style.fontSize = px(P.head_px); place(h, P.pad, P.head_y);
        const dv = document.createElement("div"); dv.className = "div"; place(dv, P.pad, P.div_y, P.w - 2 * P.pad, null);
        const sp = document.createElement("div"); sp.className = "spec";
        const gl = document.createElement("div"); gl.className = "glow";
        e.appendChild(h); e.appendChild(dv); e.appendChild(sp); e.appendChild(gl);
        P.rows.forEach(r => {
          const row = document.createElement("div"); row.className = "row"; place(row, P.pad, r.y, P.w - 2 * P.pad, r.h);
          const ck = document.createElement("div"); ck.className = "ck"; place(ck, 0, (r.h - P.ck) / 2, P.ck, P.ck);
          const k = P.ck;
          ck.innerHTML = `<svg width="${k}" height="${k}" viewBox="0 0 ${k} ${k}"><path d="M ${k*0.27} ${k*0.52} L ${k*0.44} ${k*0.68} L ${k*0.74} ${k*0.34}" fill="none" stroke="rgb(104,197,255)" stroke-width="${Math.max(3, k*0.1)}" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
          const s = document.createElement("div"); s.className = "s"; s.textContent = r.s; s.style.fontSize = px(P.row_px); place(s, P.ck + 26, r.ty);
          row.appendChild(ck); row.appendChild(s); e.appendChild(row);
          tl.fromTo(row, { opacity: 0, x: -18 }, { opacity: 1, x: 0, duration: 0.42, ease: "power2.out" }, r.t);
          tl.fromTo(ck, { scale: 0.6 }, { scale: 1, duration: 0.45, ease: "back.out(1.6)" }, r.t + 0.04);
        });
        $("panels").appendChild(e);
        tl.fromTo(e, { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" }, P.t);
        tl.fromTo(dv, { scaleX: 0 }, { scaleX: 1, duration: 0.45, ease: "power2.out" }, P.t + 0.15);
        const until = P.until, last = pi === CFG.panels.length - 1, laps = Math.max(1, (last ? Math.ceil : Math.floor)((until - P.t - 0.6) / 2.6));      // the last panel's light runs through the final frame (reviewer J R3b: the card stopped moving for its last 1.9 s)
        tl.fromTo(sp, { x: -240 }, { x: P.w + 20, duration: 2.6, ease: "none", repeat: laps - 1 }, P.t + 0.6);
        tl.fromTo(gl, { opacity: 0 }, { opacity: 0.55, duration: 1.3, ease: "sine.inOut", yoyo: true, repeat: Math.max(1, laps * 2 - 1) }, P.t + 0.6);
      });
      tl.fromTo(g, { y: 0 }, { y: CFG.drift, duration: D, ease: "sine.inOut" }, 0);
      window.__timelines["__ID__"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
