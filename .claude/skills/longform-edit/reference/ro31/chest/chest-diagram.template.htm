<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=__W__, height=__H__" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      /* Soft Blue Light CHEST DIAGRAM (RO-31, 2026-10-31): two glass panels, side view of a chest: fat spread out, and a firm gland disc.
         Drawn in SVG, not an AI picture. Script cue: "SIDE VIEW DIAGRAM OF A MAN'S CHEST". The second use adds arrows. */
      @font-face { font-family: "Poppins"; src: url("assets/Poppins-Bold.ttf") format("truetype"); font-weight: 700; }
      @font-face { font-family: "Poppins"; src: url("assets/Poppins-Regular.ttf") format("truetype"); font-weight: 400; }
      :root { --tint: rgba(22,51,81,.5); --line: rgb(64,112,153); --cyan: rgb(104,197,255); --white: rgb(244,250,255); --spec: rgb(135,210,248); }
      * { margin:0; padding:0; box-sizing:border-box; }
      html, body { margin:0; width:__W__px; height:__H__px; overflow:hidden; background:rgb(5,13,28); }
      #root { position:relative; width:100%; height:100%; font-family:"Poppins",sans-serif; font-weight:700; }
      #field { position:absolute; left:0; top:0; width:__W__px; height:__H__px; }
      #group { position:absolute; left:0; top:0; width:__W__px; height:__H__px; }
      .t { position:absolute; white-space:nowrap; line-height:1.4; }
      #accent { position:absolute; left:64px; top:62px; width:78px; height:8px; border-radius:3px; background:var(--cyan); transform-origin:0% 50%; }
      #eyebrow { left:64px; top:80px; font-size:34px; color:var(--cyan); letter-spacing:2px; }
      .panel { position:absolute; top:160px; width:862px; height:860px; border-radius:36px; background:var(--tint); border:2px solid var(--line); overflow:hidden; }
      .panel .head { position:absolute; left:44px; top:20px; font-size:56px; color:var(--cyan); white-space:nowrap; line-height:1.4; }
      .panel .sub { position:absolute; left:44px; top:102px; font-size:36px; font-weight:400; color:var(--white); white-space:nowrap; line-height:1.4; }
      .panel .spec { position:absolute; top:0; width:220px; height:3px; background:linear-gradient(90deg,rgba(135,210,248,0),rgba(135,210,248,.95),rgba(135,210,248,0)); }
      .panel svg { position:absolute; left:0; top:170px; }
      .panel .lab { position:absolute; font-size:32px; color:var(--white); background:rgb(9,24,44); border-radius:12px; padding:6px 16px; white-space:nowrap; line-height:1.2; }
      .panel .lead { position:absolute; height:3px; background:rgba(244,250,255,.8); transform-origin:0% 50%; }
      .call { position:absolute; left:0; font-size:40px; color:rgb(9,24,44); background:var(--cyan); border-radius:16px; padding:8px 24px; white-space:nowrap; line-height:1.3; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="__ID__" data-start="0" data-duration="__DUR__" data-width="__W__" data-height="__H__">
      <canvas id="field" width="__W__" height="__H__"></canvas>
      <div id="group">
        <div id="accent"></div><div id="eyebrow" class="t"></div>
        <div class="panel" id="p0"></div><div class="panel" id="p1"></div>
      </div>
    </div>
    <script>
      const CFG = __CFG__;
      const D = CFG.dur;
      const px = v => v + "px";
      const place = (e, x, y, w, h) => Object.assign(e.style, { left: px(x), top: px(y), width: w == null ? "" : px(w), height: h == null ? "" : px(h) });
      const $ = id => document.getElementById(id);
      // ---------- the moving Soft Blue field (softblue.field, same formula as title-card) ----------
      const CW = __W__, CH = __H__, GW = Math.round(CW / 4), GH = Math.round(CH / 4), cv = $("field"), ctx = cv.getContext("2d");
      const off = document.createElement("canvas"); off.width = GW; off.height = GH;
      const octx = off.getContext("2d"), img = octx.createImageData(GW, GH);
      let seed = 8; const rnd = () => { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; };
      const noise = new Float32Array(GW * GH);
      for (let i = 0; i < noise.length; i++) { const u = Math.max(1e-9, rnd()), v = rnd(); noise[i] = 0.42 * Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); }
      const FS = Math.min(CW, CH) / 1080, SX = CW / (1920 * FS), SY = CH / (1080 * FS);
      function drawField(t) {
        const gx = .14 + .13 * Math.sin(t * .65), gy = .2 + .13 * Math.cos(t * .4), hx = .83 + .12 * Math.cos(t * .6), hy = .88;
        const d = img.data;
        for (let y = 0; y < GH; y++) {
          const yy = y / GH, gyv = (yy - gy) * SY * (yy - gy) * SY / .35, kyv = (yy - hy) * SY * (yy - hy) * SY / .18;
          for (let x = 0; x < GW; x++) {
            const xx = x / GW, i = y * GW + x;
            const g = Math.exp(-((xx - gx) * SX * (xx - gx) * SX / .18 + gyv)), k = Math.exp(-((xx - hx) * SX * (xx - hx) * SX / .12 + kyv));
            const n = noise[i], o = i * 4;
            d[o] = Math.min(255, Math.max(0, 5 + g * 5 + k * 3 + n)) | 0;
            d[o + 1] = Math.min(255, Math.max(0, 13 + g * 53 + k * 26 + n)) | 0;
            d[o + 2] = Math.min(255, Math.max(0, 28 + g * 94 + k * 62 + n)) | 0;
            d[o + 3] = 255;
          }
        }
        octx.putImageData(img, 0, 0);
        ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = "low";
        ctx.drawImage(off, 0, 0, CW, CH);
      }
      const tl = gsap.timeline({ paused: true });
      const clock = { t: 0 };
      drawField(0);
      tl.fromTo(clock, { t: 0 }, { t: D, duration: D, ease: "none", onUpdate: () => drawField(clock.t) }, 0);
      $("eyebrow").textContent = CFG.eyebrow;
      tl.fromTo($("accent"), { scaleX: 0 }, { scaleX: 1, duration: .45, ease: "power2.out" }, .05);
      tl.fromTo($("eyebrow"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: .42, ease: "expo.out" }, .08);
      // the drawing, in a 760 x 640 box: the man faces right; ribs left, then muscle, then fat, then skin
      // the whole man in profile facing right, cut open at the chest: head, neck, chest, stomach, so it reads as a man and not as a breast
      const SKIN = "rgb(226,178,142)";
      const HEAD = `<g><path d="M150 176 L150 118 L232 118 L238 170 Z" fill="${SKIN}"/>
        <path d="M128 66 C128 16, 172 -4, 212 2 C246 8, 262 34, 262 62 L280 92 C282 98, 276 100, 268 100 L268 118 C268 134, 254 142, 232 140 C196 138, 150 138, 136 112 C130 98, 128 84, 128 66 Z" fill="${SKIN}"/>
        <path d="M126 76 C116 20, 168 -14, 218 -6 C254 0, 270 24, 264 44 C240 34, 214 34, 196 42 C186 58, 184 72, 172 80 C160 88, 136 92, 126 76 Z" fill="rgb(38,36,40)"/>
        <ellipse cx="166" cy="82" rx="12" ry="18" fill="rgb(204,152,120)"/></g>`;
      const BODY = {
        fat:   "M238 150 C 296 170, 372 204, 404 262 C 428 310, 438 372, 438 440 C 438 520, 426 590, 402 640 L 84 640 L 84 214 C 84 178, 116 158, 150 150 Z",
        gland: "M238 150 C 276 164, 316 192, 338 236 C 346 252, 352 262, 362 272 C 372 282, 370 298, 358 306 C 342 340, 330 400, 330 470 C 330 540, 338 600, 346 640 L 84 640 L 84 214 C 84 178, 116 158, 150 150 Z"
      };
      const FATIN = "M238 150 C 296 170, 372 204, 404 262 C 428 310, 438 372, 438 440 C 438 520, 426 590, 402 640 L 240 640 C 262 520, 262 450, 240 400 C 300 372, 330 330, 326 280 C 322 230, 282 196, 238 180 Z";
      const THIN = "M238 150 C 276 164, 316 192, 338 236 C 346 252, 352 262, 362 272 C 372 282, 370 298, 358 306 C 342 340, 330 400, 330 470 C 330 540, 338 600, 346 640 L 316 640 C 306 560, 302 470, 316 400 C 322 350, 330 320, 326 280 C 322 230, 282 196, 238 180 Z";
      const RIBS = [214,250,286,322,358].map(y => `<path d="M124 ${y} C 160 ${y-8}, 196 ${y+2}, 226 ${y+18}" fill="none" stroke="rgb(240,236,226)" stroke-width="15" stroke-linecap="round" opacity=".92"/>`).join("");
      const MUSCLE = `<path d="M232 182 C 280 198, 318 232, 322 280 C 326 330, 296 372, 236 398 C 224 340, 224 240, 232 182 Z" fill="rgb(206,84,92)"/>` +
        [214,244,274,304,334].map((y,k) => `<path d="M238 ${y} C 262 ${y+4}, 288 ${y+12}, ${314-Math.abs(k-2)*14} ${y+24}" fill="none" stroke="rgb(236,142,142)" stroke-width="3.5" opacity=".6"/>`).join("");
      const svg = (kind) => {
        const nip = kind === "fat" ? [421, 300] : [367, 289];
        const dots = kind === "fat" ? [[344,222],[378,270],[392,330],[398,400],[396,470],[372,540],[340,450],[310,510],[352,342]].map(([x,y]) => `<circle cx="${x}" cy="${y}" r="13" fill="rgb(252,226,165)" opacity=".9"/>`).join("") : "";
        const layer = kind === "fat" ? `<g class="fatg" data-layout-allow-overflow><path d="${FATIN}" fill="rgb(246,208,128)"/>${dots}</g>` : `<path d="${THIN}" fill="rgb(246,208,128)"/>`;
        const disc = kind === "gland" ? `<g class="disc" data-layout-allow-overflow><ellipse cx="343" cy="288" rx="18" ry="46" fill="rgb(255,226,232)" stroke="rgb(255,110,145)" stroke-width="5"/>` + [[343,266],[338,290],[349,290],[343,312]].map(([x,y]) => `<circle cx="${x}" cy="${y}" r="5" fill="rgb(255,160,185)"/>`).join("") + `</g>` : "";
        return `<svg data-layout-allow-overflow width="640" height="640" viewBox="0 0 640 640" style="left:50px;overflow:visible"><path d="${BODY[kind]}" fill="${SKIN}"/>${HEAD}${RIBS}${layer}${MUSCLE}${disc}
          <ellipse cx="${nip[0]}" cy="${nip[1]}" rx="5" ry="11" fill="rgb(150,76,70)"/></svg>`;
      };
      CFG.panels.forEach((P, i) => {
        const e = $("p" + i); e.style.left = px(i ? 998 : 60);
        e.innerHTML = `<div class="head">${P.head}</div><div class="sub">${P.sub}</div>${svg(P.kind)}<div class="spec" data-layout-allow-overflow></div>`;
        P.labels.forEach(L => { const l = document.createElement("div"); l.className = "lab"; l.textContent = L.s; place(l, L.x, L.y); e.appendChild(l);
          tl.fromTo(l, { opacity: 0, x: 14 }, { opacity: 1, x: 0, duration: .4, ease: "power2.out" }, P.t + .35 + (L.d || 0)); });
        tl.fromTo(e, { opacity: 0, y: 26 }, { opacity: 1, y: 0, duration: .5, ease: "power2.out" }, P.t);
        const sp = e.querySelector(".spec"), laps = Math.max(1, Math.ceil((D - P.t) / 2.6));
        tl.fromTo(sp, { x: -240 }, { x: 880, duration: 2.6, ease: "none", repeat: laps - 1 }, P.t + .5);
        const beat = e.querySelector(P.kind === "fat" ? ".fatg" : ".disc");
        if (beat) { beat.style.transformBox = "fill-box"; beat.style.transformOrigin = "0% 50%";
          tl.fromTo(beat, { scale: P.kind === "fat" ? .86 : .4, opacity: .2 }, { scale: 1, opacity: 1, duration: .7, ease: "power2.out" }, P.t + .15);
          tl.to(beat, { scale: 1.035, duration: 1.3, ease: "sine.inOut", yoyo: true, repeat: Math.max(1, Math.floor((D - P.t - 1) / 1.3) - 1) }, P.t + 1); }
        (P.calls || []).forEach(C => { const c = document.createElement("div"); c.className = "call"; c.textContent = C.s; c.style.top = px(C.y); c.style.left = px(C.x); e.appendChild(c);
          tl.fromTo(c, { opacity: 0, scale: .8 }, { opacity: 1, scale: 1, duration: .4, ease: "back.out(1.6)" }, C.t); });
      });
      tl.fromTo($("group"), { y: 0 }, { y: -8, duration: D, ease: "sine.inOut" }, 0);
      window.__timelines["__ID__"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
