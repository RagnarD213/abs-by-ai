re\" inside the line that starts at 0:23; check piece 2's start by eye. Contains a swear (fine per Dan's rule).", "pts": ["What is said: People ask me about Dorian Yates' heavy duty training, the Mike Mentzer beyond failure training, all that stuff. ... I never went to failure. I just think that kind of training is going to beat the [expletive] out of your body over time.", "Lesson: failure is different for different people. If a spotter has never had to help you, do two more reps after you think you failed."]}, {"t": "Jay Cutler: I Never Really Trained to Failure", "v": "plain", "id": "DHfHfarTi5I", "segs": [[339, 357]], "src": "Ryan Dengler, \"TAKING JAY CUTLER THROUGH A CHEST WORKOUT!!\" (Sep 2022)", "views": "14K views", "words": "Starts on \"I never really trained to failure\". Ends on \"160 pound dumbbell presses for shoulders for easy 12\".", "what": "Mid-workout, Cutler says he kept reps around 12 with 45 to 60 second rests, never really trained to failure, had no training partner to spot him, and could do 160 pound dumbbell presses for an easy 12.", "note": "18 seconds. Gym footage, small channel. Optional lead-in from 5:29 (329): \"I seem to always keep the rep range around 12, rest periods 45 to 60, high volume\".", "pts": ["What is said: I never really trained a failure so like I didn't train with a training partner so I could I didn't have anyone that could really spot me I didn't grab a guy in the gym but everything I touched anyway in the gym like I could pretty much do for 12 reps to be honest I did 160 pound dumbbell presses for shoulders for easy 12", "Lesson: failure is different for different people. If a spotter has never had to help you, do two more reps after you think you failed."]}, {"t": "Clavicular: Do You Even Lift? No, I Do Not Lift.", "v": "plain", "id": "YN_NYiW0a6E", "segs": [[423, 426], [726, 733]], "src": "Greg Doucette, \"Juicing My Pants Reviewing Clavicular's Workout\" (Dec 2025), playing Clavicular's own stream footage", "views": "317K views", "words": "Piece 1 starts on \"Do you even lift, bro?\", ends on \"No, I do not lift\". Piece 2 starts on \"hair is more important than physique\", ends on \"I'm not looking to physique max\".", "what": "NOT the line Dan asked for. Clavicular, filmed in the gym, answers \"Do you even lift, bro?\" with \"No, I do not lift\", and later says hair is more important than physique because he is looksmaxxing, not physique maxxing.", "note": "NO clip found of Clavicular saying leave a rep in the tank, stop short of failure, or giving a failure rule. Searched his name with training to failure, reps in reserve, one rep in the tank, workout routine, lifting advice, gym, hardmaxxing; the Greg Doucette, RP, N3ON, Bradley Martyn and Fox clips. In this video it is Greg, not Clav, who says Clav \"doesn't go to failure\" (9:16); Clav's voice says \"I have not worked out\" and \"I'm already out of breath\" (9:26 to 9:34). Greg talks over the footage, so check both pieces are Clav's voice and clean. Skip the nearby drug lines. The RP critique (nSiAYoIE2N8, 917K), N3on workout (oiPZXXLT344) and Raw Talk (jkVU-oRTWyk) transcripts would not load today; worth a second look for a failure line.", "pts": ["What is said: Do you even lift, bro? No, I do not lift. ... Yeah, hair is more important than physique. I'm looking at looks max. I'm not looking to physique max.", "Lesson: failure is different for different people. If a spotter has never had to help you, do two more reps after you think you failed."]}, {"t": "Dr. Mike: Stopping a Few Reps Shy Works Just as Well", "v": "right", "id": "VW9hnJL9UZE", "segs": [[18, 26]], "src": "Renaissance Periodization (Dr. Mike Israetel), \"Jay Cutler Never Trained to Failure\" (Short, Sep 2026)", "views": "680K views", "words": "Starts on \"it turns out that stopping a few reps shy of failure\". Ends on \"It kind of evens out\".", "what": "Alternate to Clavicular for the leave-reps-in-the-tank position. Right after the Cutler line, Dr. Mike says stopping a few reps shy of failure works just as well as failure training.", "note": "Same video as the Cutler clip, so it can play straight after it. Optional lead-in at 0:07 to 0:15: \"a lot of people have spirit animals like Mike Mentzer, Ronnie Coleman, Dorian Yates that they talk about like failure training makes you a man\". Dr. Mike is a big fitness name, not a celebrity.", "pts": ["What is said: And it turns out that stopping a few reps shy of failure works just as well as failure training with a couple of pluses, couple minuses. It kind of evens out.", "Lesson: failure is different for different people. If a spotter has never had to help you, do two more reps after you think you failed."]}, {"t": "Dorian Yates: One Set to Failure Is All You Need", "v": "plain", "id": "l_xxqUq92kc", "segs": [[262, 277]], "src": "Sporty Sport, \"ONE SET TO FAILURE IS ALL YOU NEED (DORIAN YATES)\" (interview re-upload, 2022)", "views": "226K views", "words": "Starts on \"there was a meta study\". Ends on \"for 40 years\".", "what": "Six-time Mr. Olympia Dorian Yates says a meta-analysis concluded the minimum to trigger growth is one set to failure once a week, and he is glad the scientists caught up with him.", "note": "The failure camp's champion, against Cutler. Caption says \"staying\"; he says \"saying\". Optional lead-in at 4:06 (246): \"I'm still very convinced it's the most efficient way to train\". Re-upload of an interview whose original host is not named on the page.", "pts": ["What is said: there was a meta study so you know a lot of studies together what's the minimum amount of effective exercise to trigger muscle growth and their conclusion was one set of an exercise once a week to failure I'm like I'm glad the scientists caught up with me because I've been staying here for 40 years", "Lesson: failure is different for different people. If a spotter has never had to help you, do two more reps after you think you failed."]}, {"t": "What Failure Actually Means mplaint: Limits on how much you can lift (no heavy lifting, no bodybuilders)", "Lesson: the people you train around matter more than the equipment. Pick your gym by the people in it."]}, {"t": "Drop A Barbell, Trip The Lunk Alarm", "v": "plain", "id": "UXP6WaVTJpM", "segs": [[0, 12]], "src": "Tyler Kruze, \"How to trip the lunk alarm\"", "views": "2.4M views", "words": "No captions. Seen: a muscular guy curling a barbell 0:00 to 0:01, the camera swings to the 'no critics' wall and the purple lunk alarm light 0:02 to 0:04, he laughs as people look over 0:05 to 0:11.", "what": "A lifter sets off the Planet Fitness lunk alarm and grins while the gym turns to look.", "note": "Dan killed a lunk alarm clip in round 2 (no clear payoff on screen). Here the siren is audio only and the light is small; check by ear. The famous 5.1M lunk alarm clip (jiuY-FTZzlc) has embedding OFF, so this is the embeddable stand-in.", "pts": ["The complaint: The lunk alarm going off on someone", "Lesson: the people you train around matter more than the equipment. Pick your gym by the people in it."]}]}, {"id": "d05", "heading": "D05: The loudest arguments against Zepbound", "sub": "One objection per clip.", "label": "Objection", "pick": true, "reply_label": "D05 ZEPBOUND OBJECTIONS", "items": [{"t": "Jillian Michaels: You Can Never Get Off It, And You Gain It All Back", "v": "right", "id": "nlC7rDjnfnw", "segs": [[132, 151]], "src": "Club Random with Bill Maher, \"Jillian Michaels on Ozempic\"", "views": "134K views", "words": "Starts on \"you can't get off of it ever\". Ends on \"yo-yo dieting on crack\".", "what": "Jillian Michaels tells Bill Maher every meta analysis shows users regain two thirds of the weight within a year of stopping, so you can never get off it.", "note": "Bill Maher is on screen as host; this is a different clip from the JRE one already used. Covers two objections (forever plus regain), so it could open that section. Caption starts at 2:09 mid-sentence; trim the start by ion: You have to take it forever", "Proposed one word verdict (a guess unless marked): true (Dan plans to stay on it for life and treats that as fine, like a dial)", "Lesson: a low dose, lifting every day and protein first at every meal, so the weight you lose is fat and not muscle."]}, {"t": "RFK Jr.: Spend A Fifth Of That On Real Food And Obesity Ends Overnight", "v": "wrong", "id": "qX9nQ40mSMY", "segs": [[72, 93]], "src": "Robert F. Kennedy Jr. (own channel, a TV panel clip), \"Ozempic\"", "views": "62K views", "words": "Starts on \"there's a bill right now before Congress\". Ends on \"diabetes epidemic overnight\".", "what": "RFK Jr. on a TV panel says covering the drug would cost 3 trillion dollars a year and one fifth of that spent on good food would solve obesity overnight.", "note": "21 seconds. Low view count on his own channel; the original panel (looks like a Fox panel show) may have a bigger upload. Two clips from this video on this list; keep the better one.", "pts": ["The objection: Big Pharma scam, eat real food", "Proposed one word verdict (a guess unless marked): half true, guess: Dan's position on this is not stated in the brief", "Lesson: a low dose, lifting every day and protein first at every meal, so the weight you lose is fat and not muscle."]}, {"t": "RFK Jr.: Ozempic Kills Your Reward Pathways So You Want Everything Less", "v": "plain", "id": "qX9nQ40mSMY", "segs": [[40, 55]], "src": "Robert F. Kennedy Jr. (own channel, a TV panel clip), \"Ozempic\"", "views": "62K views", "words": "Starts on \"the EU is right now investigating\". Ends on \"want to do everything less\".", "what": "RFK Jr. says the EU is investigating Ozempic for suicidal ideation and that it suppresses all the reward pathways.", "note": "Same video as the RFK real-food clip. The TODAY clip below is the backup for this objection.", "pts": ["The objection: It kills your joy", "Proposed one word verdict (a guess unless marked): guess: guess: Dan's position on this is not stated in the brief", "Lesson: a low dose, lifting every day and protein first at every meal, so the weight you lose is fat and not muscle."]}, {"t": "Amy Schumer: I Hate Ozempic. I Couldn't Lift My Head Off The Pillow", "v": "plain", "id": "unx1EuJ8t9s", "segs": [[0, 3], [66, 85]], "src": "The Howard Stern Show, \"Why Amy Schumer Stopped Using Ozempic\"", "views": "111K views", "words": "Starts on \"I hate Ozempic\" (one bleeped word). Ends on \"so what's the point\".", "what": "Amy Schumer tells Howard Stern she vomited constantly and was bedridden on Ozempic, lost 30 pounds and quit.", "note": "She says she has a gene that makes her prone to nausea; Dan may want that context. Swear is bleeped on the source.", "pts": ["The objection: Side effects wreck you", "Proposed one word verdict (a guess unless marked): half true, guess: Dan's position on this is not stated in the brief (Dan's low dose, 1.5 mg, is his likely answer)", "Lesson: a low dose, lifting every day and protein first at every meal, so the weight you lose is fat and not muscle."]}, {"t": "Sharon Osbourne: I Went Too Far. I'm Back To My Cancer Weight", "v": "plain", "id": "7AVC4guW2qc", "segs": [[52, 65], [247, 255]], "src": "Howie Mandel Does Stuff Clips, \"Sharon Osbourne Talks About Her and Kelly's Weight Loss and Ozempic\"", "views": "585K views", "words": "Starts on \"I can't put on weight now\". Ends on \"my cancer weight\".", "what": "Sharon Osbourne tells Howie Mandel she lost 45 pounds, can't put weight back on, and is now at the weight she was during cancer.", "note": "Covers the too thin / Ozempic face objection with a famous name. Second piece is Howie's question then her answer; check the cut by ear.", "pts": ["The objection: Too thin, Ozempic face", "Proposed one word verdict (a guess unless marked): half true, guess: Dan's position on this is not stated in the brief (fits Dan's dial idea: lower the dose)", "Lesson: a low dose, lifting every day and protein first at every meal, so the weight you lose is fat and not muscle."]}, {"t": "Johann Hari: Ozempic Raises Thyroid Cancer Risk 50 To 75 Percent", "v": "plain", "id": "8lit8EUvrW8", "segs": [[130, 142]], "src": "The Diary Of A CEO Clips, \"The SHOCKING Side Effects Of OZEMPIC\"", "views": "1.7M views", "words": "Starts on \"what he discovered was very sobering\". Ends on \"I was like what the\" (swear).", "what": "Johann Hari, who wrote a book on Ozempic, cites a French study finding a 50 to 75 percent higher thyroid cancer risk.", "note": "Hari himself says right after that the absolute risk stays small and some scientists dispute it; the cut ends before that. Same video at 4:53 has pancreatitis \"nine times more likely\".", "pts": ["The objection: Thyroid cancer, unknown long term", "Proposed one word verdict (a guess unless marked): guess: guess: Dan's position on this is not stated in the brief", "Lesson: a low dose, lifting every day and protein first at every meal, so the weight you lose is fat and not muscle."]}, {"t": "Jillian Michaels: Pancreatitis, Stomach Paralysis, Thyroid Cancer, Just Eat Less", "v": "plain", "id": "zpyibQvpjcw", "segs": [[68, 88]], "src": "NewsNation, \"Jillian Michaels makes case against Ozempic use\"", "views": "75K views", "words": "Starts on \"You can lose weight by eating less\". Ends on \"vision problems\".", "what": "Jillian Michaels rattles off the side effect list on NewsNation and says you can lose weight by eating less and moving more with none of them.", "note": "Check by eye that Jillian is the one speaking at 1:08 (it is a debate segment with Calley Means and a doctor). Calley Means in the same video at 13:48 to 14:20: \"nothing more powerful than an obese, sick child\" and \"a lifetime recurring annuity\" if Dan wants a second Means line.", "pts": ["The objection: Stomach paralysis, pancreatitis, cancer", "Proposed one word verdict (a guess unless marked): guess: guess: Dan's position on this is not stated in the brief", "Lesson: a low dose, lifting every day and protein first at every meal, so the weight you lose is fat and not muscle."]}, {"t": "Mark Hyman On Megyn Kelly: Lose 50 Pounds, Half Is Muscle, Gain It Back As Fat", "v": "right", "id": "l1bCuPkoa-0", "segs": [[79, 98]], "src": "Megyn Kelly, \"Dangers and Benefits of Ozempic and GLP-1 Drugs, and Skinny Fat Effect\"", "views": "53K views", "words": "Starts on \"you see people losing more half their weight as muscle\". Ends on \"Now it's all fat\".", "what": "Dr. Mark Hyman tells Megyn Kelly people lose half their weight as muscle, quit, regain it as fat, and end up slower.", "note": "Megyn Kelly is the draw; low views on this upload.", "pts": ["The objection: Skinny fat, muscle loss", "Proposed one word verdict (a guess unless marked): true (Dan's exact case for lifting and protein first; he also stays on it)", "Lesson: a low dose, lifting every day and protein first at every meal, so the weight you lose is fat and not muscle."]}, {"t": "Mark Hyman: Without Protein And Lifting, You'll Be Skinny Fat", "v": "right", "id": "l1bCuPkoa-0", "segs": [[128, 143]], "src": "Megyn Kelly, \"Dangers and Benefits of Ozempic and GLP-1 Drugs, and Skinny Fat Effect\"", "views": "53K views", "words": "Starts on \"120 pounds, you need 120 grams of protein\". Ends on \"Skinny fat\" (Megyn).", "what": "Hyman says the drug must come with protein and a strength program or you end up skinny fat; Megyn Kelly agrees.", "note": "Second clip from the same video; keep one of the two Hyman clips if the batch needs variety.", "pts": ["The objection: Skinny fat if you don't lift", "Proposed one word verdict (a guess unless marked): true (this is Dan's own rule, so a rare agree card)", "Lesson: a low dose, lifting every day and protein first at every meal, so the weight you lose is fat and not muscle."]}, {"t": "TODAY: GLP-1 Dad Stopped Caring About His Cubs. 'Ozempic Personality'", "v": "plain", "id": "jmje7zHtHfE", "segs": [[34, 48], [58, 67]], "src": "TODAY (NBC), \"What is Ozempic Personal es a day to bulk for Thor, and you should not copy him.", "note": "Weakest card: his chef, not Chris. Keep only if a bulk-diet slot is needed.", "pts": ["The diet: Thor bulk: 5,000 plus calories, 50 to 55 percent carbs, oats, smoothies, chicken and rice", "Lesson: score it out of 10 for a normal guy, and name the one thing worth stealing."]}]}, {"id": "d07", "heading": "D07: Alex Hormozi's Fitness Rules", "sub": "Videos on his own channel open on YouTube at the right second instead of playing here.", "label": "Hormozi rule", "pick": true, "reply_label": "D07 HORMOZI RULES", "items": [{"t": "Hormozi: Every Diet Is Just Fewer Calories", "v": "right", "id": "RpqSy5V1fFQ", "segs": [[297, 313]], "src": "Alex Hormozi, \"My Unconventional Diet Explained in 15min\"", "views": "703K views", "words": "Starts on \"you're eliminating calories\". Ends on \"it's all that matters okay\".", "what": "Hormozi says keto, low fat, portion control and fasting all work only because each removes calories.", "note": "Contains \"horseshit\" (uncensored). Captions are line level; leave half a second at the start. Owner has embedding off (401): the page card links out; the editor downloads from YouTube.", "pts": ["The rule: Calories are the only thing that decides fat loss; the diet style does not matter.", "Proposed verdict: He's right, with a spin (guess). Touches: fasting until 2 PM, low carb first meal, Zepbound, photographing food. Dan's version: calories decide it, and his fasting, salad and dose are just tools that make the calorie number easy to hit.", "Lesson: your version of the rule, in one line (in the Doc)."], "noembed": true}, {"t": "Hormozi: One Meal Or Five, It Doesn't Matter", "v": "right", "id": "RpqSy5V1fFQ", "segs": [[763, 775]], "src": "Alex Hormozi, \"My Unconventional Diet Explained in 15min\"", "views": "703K views", "words": "Starts on \"you can split up those meals whatever way you want\". Ends on \"it doesn't matter\".", "what": "Hormozi says meal timing and meal count are irrelevant once calories and protein are set.", "note": "Owner has embedding off (401): the page card links out; the editor downloads from YouTube.", "pts": ["The rule: Meal timing and number of meals do not matter.", "Proposed verdict: He's right on fat loss, wrong for the average guy (guess). Touches: fasting until 2 PM, carbs at night, last meal smallest. Dan's version: timing doesn't burn fat, but a fixed eating window is what stops him snacking all morning.", "Lesson: your version of the rule, in one line (in the Doc)."], "noembed": true}, {"t": "Hormozi: Eat Ice Cream Every Day So You Never Need A Cheat Day", "v": "wrong", "id": "RpqSy5V1fFQ", "segs": [[794, 808]], "src": "Alex Hormozi, \"My Unconventional Diet Explained in 15min\"", "views": "703K views", "words": "Starts on \"the best way to get people to become obsessed with food\". Ends on \"it stops being special\".", "what": "Hormozi says restriction causes binges, so he eats ice cream and cookies daily and never has a cheat day.", "note": "The 13:04 line before it (\"you won't feel like you're cheating on a cheat day because you have ice cream every day\") names cheat days outright; adding it from 13:08 makes the clip about 20 s. Owner has embedding off (401): the page card links out; the editor downloads from YouTube.", "pts": ["The rule: No cheat days: eat the treat every day so it stops being special.", "Proposed verdict: He's right about cheat days, wrong about the fix (guess). Touches: no cheat days, zero liquid calories, low carb first meal. Dan also has no cheat day, but gets there by not keeping the treat in the routine.", "Lesson: your version of the rule, in one line (in the Doc)."], "noembed": true}, {"t": "Hormozi: A Pint Of Ice Cream For Dinner Is Fine", "v": "wrong", "id": "fxyhIXZ6Yog", "segs": [[149, 153], [161, 173]], "src": "Alex Hormozi, \"The Alex Hormozi Diet (REVEALED)\"", "views": "738K views", "words": "Piece 1 starts on \"you can do whatever you want with them\". Piece 2 starts on \"you could just stay at home\" and ends on \"it doesn't matter\".", "what": "After hitting protein, Hormozi says the leftover 880 calories can be anything, even a whole pint of ice cream or two cookies as dinner.", "note": "Shows cookies on the table, good visual. Owner has embedding off (401): the page card links out; the editor downloads from YouTube.", "pts": ["The rule: Protein first, then the leftover calories can be anything.", "Proposed verdict: He's right on protein first, wrong on \"anything\" for the average guy (guess). Touches: protein first at every meal, low carb first meal, carbs at night, zero liquid calories. Dan's version: protein first, then food that keeps you full, because a pint of ice cream does not.", "Lesson: your version of the rule, in one line (in the Doc)."], "noembed": true}, {"t": "Hormozi: 1 Gram Of Protein Per Pound, 2 Pounds Of Meat A Day", "v": "wrong", "id": "fxyhIXZ6Yog", "segs": [[88, 106]], "src": "Alex Hormozi, \"The Alex Hormozi Diet (REVEALED)\"", "views": "738K views", "words": "Starts on \"you multiply it by one\". Ends on \"a pound is 100 g of protein\".", "what": "Hormozi sets protein at one gram per pound of body weight and waves off the science nerds.", "note": "18 s. Has a bleeped or dropped swear at \"don't give a\". Same rule in RpqSy5V1fFQ 8:36 to 9:16 (\"I eat two pounds of meat a day\") if a cleaner line is wanted. Owner has embedding off (401): the page card links out; the editor downloads from YouTube.", "pts": ["The rule: Eat 1 gram of protein per pound of body weight.", "Proposed verdict: He's wrong on the number, right on the habit (guess). Touches: 0.8 g per pound of lean mass, protein first. Dan's version: count lean mass, not total weight, so a 220 pound guy at 30% fat needs far less than 220 g.", "Lesson: your version of the rule, in one line (in the Doc)."], "noembed": true}, {"t": "Hormozi: Same Breakfast And Lunch Every Day", "v": "right", "id": "fxyhIXZ6Yog", "segs": [[200, 215]], "src":  "Lesson: your version of the rule, in one line (in the Doc)."]}, {"t": "Hormozi: If You Can't Do It For A Decade, Don't Do It For A Day", "v": "right", "id": "jYY4FDzf4p0", "segs": [[53, 65]], "src": "MoreMozi (Alex Hormozi clips), \"What Is My Fitness Routine?\"", "views": "19K views", "words": "Starts on \"there's a few things that matter\". Ends on \"don't do it for a day\".", "what": "Hormozi dismisses keto, fasting and vegan fads as preference and sets one rule: only do what you can keep for ten years.", "note": "Low view count. Same idea with more views: RpqSy5V1fFQ 8:12 to 8:27 (\"if I can't do something for the rest of my life then I don't see a point in doing it\"). Plays in the page.", "pts": ["The rule: Rules beat motivation: only adopt a habit you can keep for a decade.", "Proposed verdict: He's right (guess). Touches: no cheat days, fasting daily, training 7 days, Zepbound for life. Dan's version: every rule he keeps is one he can run forever.", "Lesson: your version of the rule, in one line (in the Doc)."]}, {"t": "Hormozi: Stop Weighing And Counting, Ask What A Healthy Person Would Do", "v": "wrong", "id": "37mqHjJOS50", "segs": [[265, 280]], "src": "The Iced Coffee Hour Clips, \"Alex Hormozi's advice on weight control | OPENING UP (Part 1)\"", "views": "23K views", "words": "Starts on \"rather than trying to zone in on the super tactical\". Ends on \"what would a healthy person do\".", "what": "Coaching an overweight host, Hormozi says skip weighing and counting and just ask what a healthy person would do.", "note": "This is the same Iced Coffee Hour talk as the used \"why aren't you 200 pounds heavier\" clip (2:50 here); this cut is a different moment, about 4 minutes later. Hormozi contradicts himself in jYY4FDzf4p0 4:32 to 4:41 (\"if you don't track what you eat... you don't even have data\"), a strong two-clip pairing. Plays in the page.", "pts": ["The rule: Do not weigh or count food; act like a healthy person.", "Proposed verdict: He's wrong (guess, follows from Dan weighing every morning and photographing food). Touches: weighs himself every morning, photographs food to track calories.", "Lesson: your version of the rule, in one line (in the Doc)."]}]}, {"id": "d08", "heading": "D08: The Fit Father dumbbell circuit", "sub": "One video, moments in order.", "label": "Fit Father", "pick": true, "reply_label": "D08 FIT FATHER MOMENTS", "items": [{"t": "The Hook: Big Bodybuilders Who Get Winded", "v": "plain", "id": "VwTeS5voWP4", "segs": [[11, 22]], "src": "Fit Father Project, \"I Used To Train Arm Day, Leg Day, Shoulder Day (Now I Do THIS)\"", "views": "40.8K views", "words": "Starts on \"And then I looked around\". Ends on \"they didn't have fitness\".", "what": "His origin story: bodybuilders with lots of muscle who got out of breath doing simple things.", "note": "Music bed under his voice.", "pts": ["What he claims: His origin story: bodybuilders with lots of muscle who got out of breath doing simple things.", "Lesson: train your whole body every workout, with sets heavy enough that the last reps are hard, and walk between them."]}, {"t": "Health Means Being Good At Everything", "v": "plain", "id": "VwTeS5voWP4", "segs": [[21, 34]], "src": "Fit Father Project, \"I Used To Train Arm Day, Leg Day, Shoulder Day (Now I Do THIS)\"", "views": "40.8K views", "words": "Starts on \"As I've matured\". Ends on \"good cardiovascular function\".", "what": "His argument against training only for muscle: fitness means flexibility, muscle and cardio together.", "note": "This is as close as he gets to attacking body-part splits; he never criticizes splits directly beyond the hook story.", "pts": ["What he claims: His argument against training only for muscle: fitness means flexibility, muscle and cardio together.", "Lesson: train your whole body every workout, with sets heavy enough that the last reps are hard, and walk between them."]}, {"t": "Especially If You're Over 40", "v": "plain", "id": "VwTeS5voWP4", "segs": [ s": ["What he claims: The setup: one pair of 25 lb dumbbells for everyone, 10 reps on every exercise, starting with squats.", "Lesson: train your whole body every workout, with sets heavy enough that the last reps are hard, and walk between them."]}, {"t": "Five Rounds, 30 Minutes, 300 Reps", "v": "plain", "id": "VwTeS5voWP4", "segs": [[262, 276], [280, 284]], "src": "Fit Father Project, \"I Used To Train Arm Day, Leg Day, Shoulder Day (Now I Do THIS)\"", "views": "40.8K views", "words": "Piece 1 starts on \"You would rest for 2 minutes maybe\" and ends on \"Probably take you 30 minutes\". Piece 2 starts on \"300 repetitions\" and ends on \"Amazing exercise\".", "what": "The full prescription: 2 minutes rest, 3 to 6 rounds, five rounds in about 30 minutes for 300 reps.", "note": "18 s. Counting total reps instead of hard sets is the core of Dan's judgment: 300 easy reps versus a few sets taken close to failure. Days per week is never stated.", "pts": ["What he claims: The full prescription: 2 minutes rest, 3 to 6 rounds, five rounds in about 30 minutes for 300 reps.", "Lesson: train your whole body every workout, with sets heavy enough that the last reps are hard, and walk between them."]}, {"t": "Longevity, Insulin, Mitochondria, No Gym Needed", "v": "plain", "id": "VwTeS5voWP4", "segs": [[299, 313]], "src": "Fit Father Project, \"I Used To Train Arm Day, Leg Day, Shoulder Day (Now I Do THIS)\"", "views": "40.8K views", "words": "Starts on \"Point of showing you this workout\". Ends on \"No gym needed\".", "what": "His biggest claims: the circuit is built for longevity, improves insulin sensitivity, grows mitochondria, helps the brain, and needs no gym.", "note": "21 s; trim to 5:13 (\"is simple\") for 14 s. He makes no fat loss or time claim beyond \"30 minutes\"; these are general health claims true of most resistance training.", "pts": ["What he claims: His biggest claims: the circuit is built for longevity, improves insulin sensitivity, grows mitochondria, helps the brain, and needs no gym.", "Lesson: train your whole body every workout, with sets heavy enough that the last reps are hard, and walk between them."]}, {"t": "The Close: Do The Work", "v": "plain", "id": "VwTeS5voWP4", "segs": [[358, 373]], "src": "Fit Father Project, \"I Used To Train Arm Day, Leg Day, Shoulder Day (Now I Do THIS)\"", "views": "40.8K views", "words": "Starts on \"strength training is one of those things\". Ends on \"than just lifting weights\".", "what": "His closing message: strength training is about showing up and investing in your future, more than lifting weights.", "note": "Alternative close at 6:14 to 6:22: \"the benefit you get is a lifetime of health, of energy, of confidence in yourself\".", "pts": ["What he claims: His closing message: strength training is about showing up and investing in your future, more than lifting weights.", "Lesson: train your whole body every workout, with sets heavy enough that the last reps are hard, and walk between them."]}]}], "reply_title": "NEXT SHOOT OUTLINES: CLIPS", "reply_help": "Tap Select on every clip you want. Anything you don't select is out."};

// Opened as a file, YouTube refuses to play inside the page (error 153). Jump to the served copy of this page.
const SERVED = "http://127.0.0.1:" + DATA.port + "/";
const AS_FILE = !/^https?:$/.test(location.protocol);
if (AS_FILE) fetch(SERVED + "__review_health", {mode:"no-cors"}).then(() => location.replace(SERVED + location.hash)).catch(() => {});

const fmt = s => Math.floor(s/60) + ":" + String(s%60).padStart(2,"0");
const el = (tag, cls, html) => { const e=document.createElement(tag); if(cls) e.className=cls; if(html!=null) e.innerHTML=html; return e; };
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;");
const tagFor = v => v==="right" ? '<span class="tag right">RIGHT</span>' : v==="wrong" ? '<span class="tag wrong">WRONG</span>' : v ? '<span class="tag plain">MY SPIN</span>' : "";
const total = r => r.segs.reduce((a,x) => a + x[1] - x[0], 0);
const span = r => r.segs.map(x => fmt(x[0]) + " to " + fmt(x[1])).join(", then ");
const killed = {};
const picked = {};
// Dan, 2026-11-12: "I click on the ones that I want to select rather than the ones I want to kill, because most of
// them I'm going to be killing." A pick section now has a Select button and an untouched card is NOT selected.
// "mode": "kill" on a section keeps the old page (Kill buttons, untouched cards are keeps).
const selectMode = sec => sec.mode !== "kill";

// Plays each piece of the clip in order, inside the page.
function play(p, r) {
  p.innerHTML = ""; p.onclick = null; p.style.cursor = "default";
  if (!(window.YT && YT.Player)) {
    const f = document.createElement("iframe"); f.allow = "autoplay; encrypted-media; picture-in-picture"; f.allowFullscreen = true;
    f.referrerPolicy = "strict-origin-when-cross-origin";
    f.setAttribute("src", "https://www.youtube.com/embed/" + r.id + "?start=" + r.segs[0][0] + "&end=" + r.segs[0][1] + "&autoplay=1&rel=0");
    p.appendChild(f); return;
  }
  const d = document.createElement("div"); p.appendChild(d); let i = 0;
  const pl = window.lastPlayer = new YT.Player(d, { videoId:r.id, playerVars:{ start:r.segs[0][0], end:r.segs[0][1], autoplay:1, rel:0 },
    events:{ onStateChange:e => { if (e.data === 0 && ++i < r.segs.length) pl.loadVideoById({ videoId:r.id, startSeconds:r.segs[i][0], endSeconds:r.segs[i][1] }); } } });
}

function killBtn(sec, i, card) {
  const set = killed[sec.id];
  const b = el("button", "kill", "Kill");
  b.onclick = () => { set.has(i) ? set.delete(i) : set.add(i);
    b.classList.toggle("on", set.has(i)); b.textContent = set.has(i) ? "Killed (undo)" : "Kill"; card.classList.toggle("killed", set.has(i)); reply(); };
  return b;
}

function pickBtn(sec, i, card) {
  if (!selectMode(sec)) return killBtn(sec, i, card);
  const set = picked[sec.id];
  const b = el("button", "sel", "Select");
  b.onclick = () => { set.has(i) ? set.delete(i) : set.add(i);
    b.classList.toggle("on", set.has(i)); b.textContent = set.has(i) ? "Selected (undo)" : "Select"; card.classList.toggle("picked", set.has(i)); reply(); };
  return b;
}

function card(sec, r, i) {
  const c = el("div", "card" + (sec.locked ? " locked" : ""));
  const b = el("div", "body");
  const tags = (sec.locked ? '<span class="tag lock">LOCKED</span>' : "") + tagFor(r.v) + (r.note ? '<span class="tag check">NOTE</span>' : "");
  let start = null;
  if (r.id) {
    const url = "https://www.youtube.com/watch?v=" + r.id + (r.segs[0][0] ? "&t=" + r.segs[0][0] + "s" : "");
    const p = el("div", "player");
    const im = document.createElement("img"); im.loading = "lazy"; im.alt = "";
    im.setAttribute("src", "https://i.ytimg.com/vi/" + r.id + "/hqdefault" + ".jpg");
    p.appendChild(im);
    p.appendChild(el("div", "play", "<span>&#9654; Play the clip, " + total(r) + " seconds" + (r.noembed ? " (opens YouTube)" : "") + "</span>"));
    start = () => { if (AS_FILE || r.noembed) window.open(url, "_blank"); else play(p, r); };
    p.onclick = start;
    c.appendChild(p);
    b.innerHTML =
      '<div class="num">' + esc(sec.label) + " " + (i+1) + "</div>" +
      '<div class="title">' + esc(r.t) + "</div><div>" + tags + "</div>" +
      '<div class="lbl">The clip</div>' +
      '<p class="clipline"><a target="_blank">Opens at ' + fmt(r.segs[0][0]) + "</a>. " + span(r) + " (" + total(r) + " seconds). " + esc(r.src) + ". " + esc(r.views) + ".</p>" +
      '<p class="quote">' + esc(r.words) + "</p>" +
      '<div class="lbl">What it is</div><p>' + esc(r.what) + "</p>" +
      '<div class="lbl">Your reaction</div><ul>' + r.pts.map(x => "<li>" + esc(x) + "</li>").join("") + "</ul>" +
      (r.note ? '<div class="note">' + esc(r.note) + "</div>" : "");
    b.querySelector(".clipline a").setAttribute("href", url);
  } else {
    b.innerHTML =
      '<div class="num">' + esc(sec.label) + " " + (i+1) + "</div>" +
      '<div class="title">' + esc(r.t) + "</div><div>" + tags + "</div>" +
      "<ul>" + r.pts.map(x => "<li>" + esc(x) + "</li>").join("") + "</ul>" +
      (r.br ? '<div class="broll"><b>B-roll.</b> ' + esc(r.br) + "</div>" : "") +
      (r.note ? '<div class="note">' + esc(r.note) + "</div>" : "");
  }
  const row = el("div", "row");
  if (sec.pick) row.appendChild(pickBtn(sec, i, c));
  if (start) { const rp = el("button", "", "Replay"); rp.onclick = start; row.appendChild(rp); }
  if (row.children.length) b.appendChild(row);
  c.appendChild(b);
  return c;
}

const wrap = document.getElementById("wrap");
if (AS_FILE) {
  const n = el("div", "note"); n.style.margin = "0 0 14px"; n.style.fontSize = "15px";
  n.textContent = "This copy was opened as a file, so play buttons open YouTube in a new tab. To play the clips inside the page, open ";
  const l = document.createElement("a"); l.textContent = SERVED; l.setAttribute("href", SERVED); n.appendChild(l);
  wrap.appendChild(n);
}
wrap.appendChild(el("h1", "", esc(DATA.title)));
wrap.appendChild(el("p", "sub", esc(DATA.sub)));
const panel = el("div", "panel", "<h3>What I decided (overrule anything)</h3><ul>" + DATA.decisions.map(x => "<li>" + x + "</li>").join("") + "</ul>");
const jump = el("div", "jump");
DATA.sections.forEach(sec => { const a = el("a", "", esc(sec.heading) + " (" + sec.items.length + ")"); a.setAttribute("href", "#" + sec.id); jump.appendChild(a); });
const ja = el("a", "", "Reply box"); ja.setAttribute("href", "#reply"); jump.appendChild(ja);
panel.appendChild(jump); wrap.appendChild(panel);

DATA.sections.forEach(sec => {
  killed[sec.id] = new Set(); picked[sec.id] = new Set();
  const h = el("h2", "", esc(sec.heading)); h.id = sec.id; wrap.appendChild(h);
  if (sec.sub) wrap.appendChild(el("p", "sub", esc(sec.sub)));
  const g = el("div", "grid"); sec.items.forEach((r, i) => g.appendChild(card(sec, r, i))); wrap.appendChild(g);
});

const rh = el("h2", "", "Reply"); rh.id = "reply"; wrap.appendChild(rh);
const rp = el("div", "panel", '<p style="margin:0">' + esc(DATA.reply_help) + '</p><textarea id="reply-box"></textarea><div class="row"><button class="primary" id="copy">Copy reply</button></div>');
wrap.appendChild(rp);

let notes = "";
function reply() {
  const box = document.getElementById("reply-box");
  const cur = box.value.split("NOTES:");
  if (cur.length > 1) notes = cur.slice(1).join("NOTES:").replace(/^\n/, "");
  let out = DATA.reply_title + "\n";
  DATA.sections.filter(s => s.pick).forEach(sec => {
    if (selectMode(sec)) {
      const s = [...picked[sec.id]].sort((a,b)=>a-b).map(x=>x+1);
      out += sec.reply_label + ": selected " + (s.length ? s.join(", ") : "none yet") + " (of " + sec.items.length + "; everything else is out)\n";
      return;
    }
    const k = [...killed[sec.id]].sort((a,b)=>a-b).map(x=>x+1);
    const keep = []; for (let j=1;j<=sec.items.length;j++) if(!k.includes(j)) keep.push(j);
    out += sec.reply_label + ": keep " + (keep.length ? keep.join(", ") : "none") + "\n  kill " + (k.length ? k.join(", ") : "none") + "\n";
  });
  (DATA.reply_lines || []).forEach(x => out += x + "\n");
  box.value = out + "NOTES:\n" + notes;
}
reply();
document.getElementById("copy").onclick = e => { const box = document.getElementById("reply-box"); box.select();
  navigator.clipboard.writeText(box.value).then(() => { e.target.textContent = "Copied"; setTimeout(() => e.target.textContent = "Copy reply", 1500); }); };
</script>
